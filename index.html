<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régie Auditorium - Musée de l'Armée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; }
        .font-prestige { font-family: 'Cinzel', serif; }
        .gradient-musee { background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%); }
        .card-premium { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        #login-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 100000; background: rgba(0,0,0,0.9); 
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); 
        }
        .radar-check:checked + label { background-color: #d4af37; color: white; border-color: #d4af37; }
    </style>
</head>
<body>

    <nav class="gradient-musee text-white p-5 shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-building-columns text-amber-500 text-2xl"></i>
                <h1 class="font-prestige text-xl tracking-widest uppercase">Auditorium Austerlitz</h1>
            </div>
            <div class="flex gap-3">
                <button onclick="document.getElementById('login-modal').style.display='flex'" id="btn-login-trigger" class="text-[10px] font-black uppercase border border-white/40 px-6 py-2 rounded-full hover:bg-white/20 transition-all cursor-pointer">Accès Régisseur</button>
                <button id="btn-logout" onclick="handleLogout()" class="hidden text-[10px] font-black uppercase bg-white text-red-900 px-6 py-2 rounded-full shadow-lg hover:bg-slate-100 transition-all">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div id="login-modal">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl mx-4 relative border-4 border-red-900">
            <h3 class="font-prestige text-xl text-center mb-6 text-red-900 border-b pb-4 italic underline underline-offset-8">Identification Régie</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Email Administrateur</label>
                    <input type="email" id="adm-email" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Mot de passe</label>
                    <input type="password" id="adm-pass" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none">
                </div>
                <button type="button" id="btn-auth-submit" class="w-full gradient-musee text-white py-4 rounded-2xl font-black uppercase shadow-lg">Se connecter</button>
                <button type="button" onclick="document.getElementById('login-modal').style.display='none'" class="w-full text-slate-400 text-[10px] font-bold uppercase mt-2">Fermer</button>
            </div>
        </div>
    </div>

    <div id="vue-client" class="max-w-5xl mx-auto py-12 px-4 space-y-8">
        <form id="main-form" class="space-y-8">
            <div class="card-premium p-8 border-t-8 border-red-900 shadow-2xl">
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-6 border-b pb-2 flex items-center gap-3"><i class="fa-solid fa-address-card text-xl"></i> Identification & Contact</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="text" id="organisme" placeholder="Organisme / Client" required class="w-full p-4 bg-slate-50 border rounded-2xl outline-none shadow-inner transition-all">
                    <input type="text" id="nom_evenement" placeholder="Nom de l'événement" required class="w-full p-4 bg-slate-50 border rounded-2xl outline-none shadow-inner transition-all">
                    <input type="text" id="point_contact" placeholder="Responsable de l'événement" required class="w-full p-4 bg-slate-50 border rounded-2xl shadow-inner">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="email" id="contact_email" placeholder="Email contact" required class="w-full p-4 bg-slate-50 border rounded-2xl shadow-inner">
                        <input type="tel" id="contact_tel" placeholder="Téléphone" class="w-full p-4 bg-slate-50 border rounded-2xl shadow-inner">
                    </div>
                    <div>
                        <label class="text-[11px] font-black uppercase text-slate-500 ml-2 italic">Date de l'événement</label>
                        <input type="date" id="date_evenement" required class="w-full p-4 bg-slate-50 border rounded-2xl shadow-md border-red-100">
                    </div>
                    <div class="grid grid-cols-3 gap-4 bg-red-50/50 p-4 rounded-2xl border-2 border-red-100">
                        <div class="flex flex-col"><label class="text-[10px] font-black uppercase text-red-900 mb-1 text-center italic">Arrivée Orga</label><input type="time" id="heure_orga" required class="w-full p-2 bg-white border rounded-xl font-bold text-center"></div>
                        <div class="flex flex-col"><label class="text-[10px] font-black uppercase text-red-900 mb-1 text-center italic">Accueil Public</label><input type="time" id="heure_public" required class="w-full p-2 bg-white border rounded-xl font-bold text-center"></div>
                        <div class="flex flex-col"><label class="text-[10px] font-black uppercase text-red-900 mb-1 text-center italic">Fin Event</label><input type="time" id="heure_fin" required class="w-full p-2 bg-white border rounded-xl font-bold text-center"></div>
                    </div>
                </div>
            </div>

            <div class="card-premium p-8 shadow-xl">
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-6 border-b pb-2 flex items-center gap-3 italic"><i class="fa-solid fa-users-gear text-xl"></i> Accueil & Logistique</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase italic mb-2 block">Nombre de participants prévus</label>
                        <input type="number" id="nb_participants" placeholder="0" class="w-full p-6 bg-slate-50 border-2 border-slate-100 rounded-3xl text-4xl font-black text-red-900 outline-none text-center shadow-inner">
                        <label class="flex items-center gap-3 mt-6 cursor-pointer bg-slate-100 p-3 rounded-xl hover:bg-slate-200 transition-all">
                            <input type="checkbox" id="wifi_public" class="w-6 h-6 accent-red-900"> 
                            <span class="text-xs font-black uppercase italic text-slate-700">Accès Wifi Public</span>
                        </label>
                    </div>
                    <div id="acc_list" class="space-y-3 bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-inner">
                        <p class="font-black text-[11px] uppercase text-red-900 italic border-b pb-1">Espaces d'Accueil</p>
                        <label class="flex gap-3 text-xs font-bold text-slate-600 hover:text-red-900 cursor-pointer"><input type="checkbox" value="Hall Orient" class="accent-red-900"> Hall Orient</label>
                        <label class="flex gap-3 text-xs font-bold text-slate-600 hover:text-red-900 cursor-pointer"><input type="checkbox" value="Auditorium" class="accent-red-900"> Auditorium</label>
                        <label class="flex gap-3 text-xs font-bold text-slate-600 hover:text-red-900 cursor-pointer"><input type="checkbox" value="Table/Desk" class="accent-red-900"> Table / Desk d'accueil</label>
                    </div>
                    <div id="vest_list" class="space-y-3 bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-inner">
                        <p class="font-black text-[11px] uppercase text-red-900 italic border-b pb-1">Vestiaires</p>
                        <label class="flex gap-3 text-xs font-bold text-slate-600 hover:text-red-900 cursor-pointer"><input type="checkbox" value="SAS Auditorium" class="accent-red-900"> SAS Auditorium</label>
                        <label class="flex gap-3 text-xs font-bold text-slate-600 hover:text-red-900 cursor-pointer"><input type="checkbox" value="Salle des Cadets" class="accent-red-900"> Salle des Cadets</label>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="card-premium p-8 border-l-[12px] border-orange-500 shadow-xl">
                    <h3 class="text-orange-700 font-black uppercase text-xs mb-6 flex items-center gap-2 italic"><i class="fa-solid fa-chair"></i> Mobilier Scène</h3>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="text-[10px] uppercase font-black text-slate-500 italic mb-1 block underline underline-offset-4 decoration-orange-300">Chaises (max 6)</label>
                            <input type="number" id="nb_chaises" min="0" max="6" value="0" class="w-full p-4 border-2 border-orange-50 rounded-2xl font-black text-xl text-orange-900 outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase font-black text-slate-500 italic mb-1 block underline underline-offset-4 decoration-orange-300">Tables (max 3)</label>
                            <input type="number" id="nb_tables" min="0" max="3" value="0" class="w-full p-4 border-2 border-orange-50 rounded-2xl font-black text-xl text-orange-900 outline-none transition-all">
                        </div>
                    </div>
                </div>
                <div class="card-premium p-8 border-l-[12px] border-blue-600 shadow-xl">
                    <h3 class="text-blue-800 font-black uppercase text-xs mb-6 flex items-center gap-2 italic"><i class="fa-solid fa-microphone-lines"></i> Moyens Techniques</h3>
                    <div class="grid grid-cols-2 gap-6 mb-6">
                        <div><label class="text-[10px] uppercase font-black text-slate-500 italic mb-1 block underline underline-offset-4 decoration-blue-300">Micros HF (max 2)</label><input type="number" id="micros_hf" min="0" max="2" value="0" class="w-full p-4 border-2 border-blue-50 rounded-2xl font-black text-xl text-blue-900"></div>
                        <div><label class="text-[10px] uppercase font-black text-slate-500 italic mb-1 block underline underline-offset-4 decoration-blue-300">Micros Filaires (max 6)</label><input type="number" id="micros_filaires" min="0" max="6" value="0" class="w-full p-4 border-2 border-blue-50 rounded-2xl font-black text-xl text-blue-900"></div>
                    </div>
                    <div id="tech_opts" class="flex flex-wrap gap-4 text-[10px] font-black uppercase text-slate-600 italic">
                        <label class="flex gap-2 items-center bg-blue-50 p-2 rounded-lg border border-blue-100 cursor-pointer"><input type="checkbox" value="Visio" class="accent-blue-600"> Visio-Conférence</label>
                        <label class="flex gap-2 items-center bg-blue-50 p-2 rounded-lg border border-blue-100 cursor-pointer"><input type="checkbox" value="Captation" class="accent-blue-600"> Captation Vidéo</label>
                        <label class="flex gap-2 items-center bg-blue-50 p-2 rounded-lg border border-blue-100 cursor-pointer"><input type="checkbox" value="Record" class="accent-blue-600"> Enregistrement</label>
                    </div>
                </div>
            </div>

            <div class="card-premium p-8 border-l-[12px] border-amber-600 bg-amber-50/20 shadow-xl">
                <h3 class="text-amber-800 font-black uppercase text-sm mb-4 italic flex items-center gap-3"><i class="fa-solid fa-chalkboard-user text-xl"></i> Salle des Cadets</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <label class="flex items-center gap-5 p-6 bg-white rounded-3xl border-2 border-amber-100 cursor-pointer shadow-sm group">
                        <input type="checkbox" id="cadets_retrans" class="w-10 h-10 accent-amber-700 transition-transform group-hover:scale-110">
                        <span class="text-xs font-black uppercase text-amber-900 leading-tight">Retransmission Auditorium en direct (Vidéo & Audio)</span>
                    </label>
                    <textarea id="cadets_notes" placeholder="Besoins spécifiques Salle des Cadets..." class="w-full p-6 bg-white border-2 border-amber-100 rounded-3xl h-32 text-sm outline-none shadow-inner font-medium"></textarea>
                </div>
            </div>
            <button type="submit" id="submit-btn" class="w-full gradient-musee text-white py-8 rounded-full text-2xl font-black uppercase tracking-[0.4em] shadow-2xl hover:scale-[1.02] transition-all">Envoyer la fiche technique</button>
        </form>
    </div>

    <div id="vue-admin" class="hidden max-w-7xl mx-auto py-12 px-4 space-y-12">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 card-premium p-8 bg-white border-t-4 border-red-900">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="year-title" class="font-prestige text-red-900 text-lg uppercase underline decoration-amber-500 underline-offset-4 tracking-tighter italic">Activité Mensuelle 2026</h3>
                    <i class="fa-solid fa-chart-line text-red-100 text-4xl"></i>
                </div>
                <canvas id="chartMonths" height="120"></canvas>
            </div>
            <div class="card-premium p-8 bg-white border-t-4 border-red-900 shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-prestige text-red-900 text-sm uppercase underline decoration-amber-500 underline-offset-4 italic">Radar des Besoins</h3>
                    <i class="fa-solid fa-compass text-amber-500 text-2xl animate-pulse"></i>
                </div>
                <div id="radar-controls" class="flex flex-wrap gap-1 mb-4 border-b pb-4 border-slate-100">
                    <div class="radar-opt"><input type="checkbox" checked id="ax-affluence" class="hidden radar-check" value="Affluence"><label for="ax-affluence" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Affluence</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-hf" class="hidden radar-check" value="Micros HF"><label for="ax-hf" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">HF</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-fil" class="hidden radar-check" value="Micros Fil"><label for="ax-fil" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Fil</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-capt" class="hidden radar-check" value="Captation"><label for="ax-capt" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Captation</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-visio" class="hidden radar-check" value="Visio"><label for="ax-visio" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Visio</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-mobi" class="hidden radar-check" value="Mobilier"><label for="ax-mobi" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Mobilier</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-pres" class="hidden radar-check" value="Présentation"><label for="ax-pres" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Présentation</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-audio" class="hidden radar-check" value="Enregistrement"><label for="ax-audio" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Audio</label></div>
                </div>
                <canvas id="chartRadar"></canvas>
            </div>
        </div>
        <div id="admin-list" class="grid grid-cols-1 gap-10"></div>
    </div>

    <script>
        const S_URL = 'https://hecyorhhyidlfdluelit.supabase.co'; 
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlY3lvcmhoeWlkbGZkbHVlbGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5OTI3MDAsImV4cCI6MjA4MjU2ODcwMH0.KloEAEbI1hgP1yR4vU2in4QVgg4AkBqrTtisPb2fdes';
        const _supa = supabase.createClient(S_URL, S_KEY);
        let charts = {};
        let currentData = [];

        document.getElementById('btn-auth-submit').addEventListener('click', async () => {
            const email = document.getElementById('adm-email').value;
            const password = document.getElementById('adm-pass').value;
            const { error } = await _supa.auth.signInWithPassword({ email, password });
            if (error) alert("Identification échouée.");
            else { document.getElementById('login-modal').style.display = 'none'; basculerVueAdmin(); }
        });

        function basculerVueAdmin() {
            document.getElementById('vue-client').classList.add('hidden');
            document.getElementById('vue-admin').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
            document.getElementById('btn-login-trigger').classList.add('hidden');
            chargerDonnees();
        }

        async function chargerDonnees() {
            const { data, error } = await _supa.from('demandes_auditorium').select('*').order('date_evenement', { ascending: true });
            if (data) { currentData = data; renderList(data); initCharts(data); }
        }

        function renderList(data) {
            document.getElementById('admin-list').innerHTML = data.map(d => `
                <div class="card-premium overflow-hidden border-t-8 border-red-900 shadow-2xl group transition-all">
                    <div class="p-6 bg-slate-100 flex justify-between items-center border-b-2 border-slate-200">
                        <div>
                            <div class="flex items-center gap-3 mb-1">
                                <span class="bg-red-900 text-white px-5 py-2 rounded-full text-[12px] font-black uppercase italic shadow-lg">${d.date_evenement}</span>
                                <span class="font-prestige text-2xl text-slate-800 tracking-tight">${d.nom_evenement}</span>
                            </div>
                            <p class="text-[12px] font-black text-slate-500 uppercase italic flex items-center gap-3 mt-2 tracking-widest italic">
                                <i class="fa-solid fa-landmark text-amber-600 text-lg"></i> ${d.organisme} <span class="text-slate-300">|</span> <i class="fa-solid fa-user-tie"></i> ${d.point_contact}
                            </p>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="genererPDF('${d.id}')" class="bg-slate-900 text-white px-8 py-3 rounded-full text-[11px] font-black uppercase shadow-xl hover:bg-red-900 transition-all flex items-center gap-2">
                                <i class="fa-solid fa-file-pdf"></i> GENERER PDF
                            </button>
                            <button onclick="supprimerLigne('${d.id}')" class="bg-white text-red-600 border-2 border-red-100 p-3 rounded-full hover:bg-red-600 hover:text-white transition-all shadow-md">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <div class="p-10 grid grid-cols-1 md:grid-cols-4 gap-12 text-[12px] leading-relaxed bg-white relative">
                        <div class="space-y-4">
                            <p class="font-black text-red-900 uppercase italic mb-4 border-b-2 border-red-50 pb-2 flex items-center gap-2 italic">LOGISTIQUE</p>
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <p class="flex justify-between mb-2"><span>Participants :</span> <strong class="text-red-900 font-black text-lg">${d.nb_participants}</strong></p>
                                <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Espaces :</p>
                                <p class="font-bold text-slate-700 leading-tight">${d.lieux_accueil?.join(' • ') || 'Standard'}</p>
                            </div>
                        </div>
                        <div class="border-l-2 border-slate-50 pl-8 space-y-4">
                            <p class="font-black text-orange-600 uppercase italic mb-4 border-b-2 border-orange-50 pb-2 flex items-center gap-2 italic">MOBILIER</p>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-orange-50 p-4 rounded-3xl text-center">
                                    <span class="block text-[9px] font-black uppercase mb-1">Chaises</span>
                                    <span class="text-3xl font-black text-orange-600">${d.nb_chaises}</span>
                                </div>
                                <div class="bg-orange-50 p-4 rounded-3xl text-center">
                                    <span class="block text-[9px] font-black uppercase mb-1">Tables</span>
                                    <span class="text-3xl font-black text-orange-600">${d.nb_tables}</span>
                                </div>
                            </div>
                        </div>
                        <div class="border-l-2 border-slate-50 pl-8 space-y-4">
                            <p class="font-black text-blue-600 uppercase italic mb-4 border-b-2 border-blue-50 pb-2 flex items-center gap-2 italic">TECHNIQUE</p>
                            <div class="bg-blue-50/50 p-4 rounded-2xl border border-blue-100 space-y-3">
                                <p class="flex justify-between font-bold"><span>Micros HF :</span> <span class="bg-blue-600 text-white px-2 rounded">${d.micros_hf_regie}</span></p>
                                <p class="flex justify-between font-bold"><span>Micros Fil :</span> <span class="bg-blue-600 text-white px-2 rounded">${d.micros_filaires_scene}</span></p>
                                <div class="pt-2 flex flex-wrap gap-1">${d.options_tech?.map(opt => `<span class="bg-white border border-blue-200 text-[9px] px-2 py-1 rounded-full font-black text-blue-800 uppercase">${opt}</span>`).join('') || ''}</div>
                            </div>
                        </div>
                        <div class="border-l-2 border-slate-50 pl-8 space-y-4 bg-amber-50/30 p-6 rounded-3xl border-2 border-amber-50">
                            <p class="font-black text-amber-800 uppercase italic mb-4 border-b-2 border-amber-100 pb-2 flex items-center gap-2 italic">PLANNING</p>
                            <div class="space-y-2">
                                <div class="flex justify-between font-bold"><span>Orga :</span> <span>${d.heure_orga}</span></div>
                                <div class="flex justify-between font-bold"><span>Public :</span> <span>${d.heure_public}</span></div>
                                <div class="pt-4 flex items-center gap-3">
                                    <span class="text-[10px] font-black uppercase italic">Cadets :</span>
                                    ${d.cadets_retransmission ? '<i class="fa-solid fa-circle-check text-green-600"></i>' : '<i class="fa-solid fa-circle-xmark text-slate-300"></i>'}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function supprimerLigne(id) {
            if(confirm("Supprimer l'événement ?")) { await _supa.from('demandes_auditorium').delete().eq('id', id); chargerDonnees(); }
        }

        function initCharts(data) {
            const currentYear = 2026;
            document.getElementById('year-title').innerText = `Activité Mensuelle ${currentYear}`;

            const ctxBar = document.getElementById('chartMonths').getContext('2d');
            const months = Array(12).fill(0);
            data.forEach(d => { if(d.date_evenement) months[new Date(d.date_evenement).getMonth()]++; });
            if(charts.bar) charts.bar.destroy();
            charts.bar = new Chart(ctxBar, { 
                type: 'bar', 
                data: { labels: ['Jan','Fév','Mar','Avr','Mai','Jui','Jui','Aoû','Sep','Oct','Nov','Déc'], datasets: [{ label: 'Événements', data: months, backgroundColor: '#7f1d1d', borderRadius: 10 }] },
                options: { plugins: { legend: { display: false } } }
            });

            updateRadar();
        }

        // MISE À JOUR DYNAMIQUE DU RADAR
        function updateRadar() {
            const data = currentData;
            const total = data.length || 1;
            const ctxRadar = document.getElementById('chartRadar').getContext('2d');
            
            // Calcul des métriques possibles
            const fullMetrics = {
                'Affluence': (data.reduce((a, b) => a + (b.nb_participants || 0), 0) / total) / 20,
                'Micros HF': (data.reduce((a, b) => a + (b.micros_hf_regie || 0), 0) / total) * 5,
                'Micros Fil': (data.reduce((a, b) => a + (b.micros_filaires_scene || 0), 0) / total) * 1.6,
                'Captation': (data.filter(d => d.options_tech?.includes('Captation')).length / total) * 10,
                'Visio': (data.filter(d => d.options_tech?.includes('Visio')).length / total) * 10,
                'Mobilier': (data.reduce((a, b) => a + (b.nb_chaises || 0) + (b.nb_tables || 0), 0) / total),
                'Présentation': (data.filter(d => (d.nb_participants > 0)).length / total) * 5, // Simple base
                'Enregistrement': (data.filter(d => d.options_tech?.includes('Record')).length / total) * 10
            };

            const selectedAxes = Array.from(document.querySelectorAll('.radar-check:checked')).map(i => i.value);
            const labels = selectedAxes;
            const radarValues = selectedAxes.map(axis => fullMetrics[axis] || 0);

            if(charts.radar) charts.radar.destroy();
            charts.radar = new Chart(ctxRadar, { 
                type: 'radar', 
                data: { 
                    labels: labels, 
                    datasets: [{ 
                        data: radarValues, 
                        backgroundColor: 'rgba(212, 175, 55, 0.4)', 
                        borderColor: '#d4af37', 
                        borderWidth: 4, pointBackgroundColor: '#7f1d1d', pointRadius: 5
                    }] 
                },
                options: {
                    scales: { r: { min: 0, max: 10, ticks: { display: false }, pointLabels: { font: { size: 9, weight: 'bold' }, color: '#475569' } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // Ecouteur pour le radar dynamique
        document.querySelectorAll('.radar-check').forEach(el => el.addEventListener('change', updateRadar));

        // GENERATION PDF
        window.genererPDF = function(id) {
            const d = currentData.find(item => item.id === id);
            if(!d) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(127, 29, 29);
            doc.rect(0, 0, 210, 40, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold"); doc.setFontSize(20);
            doc.text("FICHE TECHNIQUE AUDITORIUM", 20, 25);
            doc.setTextColor(0,0,0); doc.setFontSize(10);
            doc.text(`Edité le : ${new Date().toLocaleDateString()}`, 160, 50);
            doc.autoTable({
                startY: 60,
                head: [['IDENTIFICATION', 'DETAILS']],
                body: [['Evenement', d.nom_evenement.toUpperCase()],['Organisme', d.organisme],['Date', d.date_evenement],['Contact', d.point_contact],['Horaires', `${d.heure_orga} - ${d.heure_fin}`]],
                headStyles: { fillColor: [127, 29, 29] }
            });
            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 10,
                head: [['TECHNIQUE & LOGISTIQUE', 'VALEURS']],
                body: [['Participants', d.nb_participants],['Micros HF / Fil', `${d.micros_hf_regie} / ${d.micros_filaires_scene}`],['Chaises / Tables', `${d.nb_chaises} / ${d.nb_tables}`],['Options', d.options_tech?.join(', ') || 'Standard'],['Notes Cadets', d.cadets_notes || '/']],
                headStyles: { fillColor: [212, 175, 55] }
            });
            doc.save(`Fiche_${d.nom_evenement}.pdf`);
        };

        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                organisme: document.getElementById('organisme').value,
                nom_evenement: document.getElementById('nom_evenement').value,
                point_contact: document.getElementById('point_contact').value,
                contact_email: document.getElementById('contact_email').value, 
                contact_tel: document.getElementById('contact_tel').value,
                date_evenement: document.getElementById('date_evenement').value,
                heure_orga: document.getElementById('heure_orga').value,
                heure_public: document.getElementById('heure_public').value,
                heure_fin: document.getElementById('heure_fin').value,
                nb_participants: parseInt(document.getElementById('nb_participants').value) || 0,
                wifi_public: document.getElementById('wifi_public').checked,
                lieux_accueil: Array.from(document.querySelectorAll('#acc_list input:checked')).map(i => i.value),
                lieux_vestiaire: Array.from(document.querySelectorAll('#vest_list input:checked')).map(i => i.value),
                nb_chaises: parseInt(document.getElementById('nb_chaises').value) || 0,
                nb_tables: parseInt(document.getElementById('nb_tables').value) || 0,
                micros_hf_regie: parseInt(document.getElementById('micros_hf').value) || 0,
                micros_filaires_scene: parseInt(document.getElementById('micros_filaires').value) || 0,
                options_tech: Array.from(document.querySelectorAll('#tech_opts input:checked')).map(i => i.value),
                cadets_retransmission: document.getElementById('cadets_retrans').checked,
                cadets_notes: document.getElementById('cadets_notes').value
            };
            const { error } = await _supa.from('demandes_auditorium').insert([payload]);
            if (!error) { alert("✓ Transmis !"); location.reload(); }
        };

        function handleLogout() { _supa.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
