<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régie Auditorium - Musée de l'Armée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; }
        .font-prestige { font-family: 'Cinzel', serif; }
        .gradient-musee { background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%); }
        .card-premium { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        #login-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 100000; background: rgba(0,0,0,0.9); 
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); 
        }
    </style>
</head>
<body>

    <nav class="gradient-musee text-white p-5 shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-building-columns text-amber-500 text-2xl"></i>
                <h1 class="font-prestige text-xl tracking-widest">Auditorium Austerlitz</h1>
            </div>
            <div class="flex gap-3">
                <button onclick="document.getElementById('login-modal').style.display='flex'" id="btn-login-trigger" class="text-[10px] font-black uppercase border border-white/40 px-6 py-2 rounded-full hover:bg-white/20 transition-all cursor-pointer">Accès Régisseur</button>
                <button id="btn-logout" onclick="handleLogout()" class="hidden text-[10px] font-black uppercase bg-white text-red-900 px-6 py-2 rounded-full shadow-lg">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div id="login-modal">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl mx-4">
            <h3 class="font-prestige text-xl text-center mb-6 text-red-900 border-b pb-4 italic">Identification Régie</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Email Administrateur</label>
                    <input type="email" id="adm-email" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Mot de passe</label>
                    <input type="password" id="adm-pass" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none">
                </div>
                <button type="button" id="btn-auth-submit" class="w-full gradient-musee text-white py-4 rounded-2xl font-black uppercase shadow-lg">Entrer</button>
                <button type="button" onclick="document.getElementById('login-modal').style.display='none'" class="w-full text-slate-400 text-[10px] font-bold uppercase mt-2">Annuler</button>
            </div>
        </div>
    </div>

    <div id="vue-client" class="max-w-5xl mx-auto py-12 px-4 space-y-8">
        <form id="main-form" class="space-y-8">
            <div class="card-premium p-8">
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-6 border-b pb-2 flex items-center gap-3"><i class="fa-solid fa-address-card"></i> Identification & Contact</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="text" id="organisme" placeholder="Organisme / Client" required class="w-full p-4 bg-slate-50 border rounded-2xl outline-none">
                    <input type="text" id="nom_evenement" placeholder="Nom de l'événement" required class="w-full p-4 bg-slate-50 border rounded-2xl outline-none">
                    <input type="text" id="point_contact" placeholder="Responsable de l'événement" required class="w-full p-4 bg-slate-50 border rounded-2xl">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="email" id="contact_email" placeholder="Email contact" required class="w-full p-4 bg-slate-50 border rounded-2xl">
                        <input type="tel" id="contact_tel" placeholder="Téléphone" class="w-full p-4 bg-slate-50 border rounded-2xl">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-slate-400 ml-2 italic">Date de l'événement</label>
                        <input type="date" id="date_evenement" required class="w-full p-4 bg-slate-50 border rounded-2xl">
                    </div>
                    <div class="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-2xl border">
                        <div class="text-center">
                            <span class="text-[9px] font-black uppercase text-red-900 block mb-1">Arrivée Orga</span>
                            <input type="time" id="heure_orga" required class="w-full p-2 border rounded-xl font-bold text-center">
                        </div>
                        <div class="text-center">
                            <span class="text-[9px] font-black uppercase text-red-900 block mb-1">Accueil Public</span>
                            <input type="time" id="heure_public" required class="w-full p-2 border rounded-xl font-bold text-center">
                        </div>
                        <div class="text-center">
                            <span class="text-[9px] font-black uppercase text-red-900 block mb-1">Fin Event</span>
                            <input type="time" id="heure_fin" required class="w-full p-2 border rounded-xl font-bold text-center">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-premium p-8">
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-6 border-b pb-2 italic"><i class="fa-solid fa-users-gear mr-2"></i>Accueil & Logistique</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase italic">Participants prévus</label>
                        <input type="number" id="nb_participants" placeholder="0" class="w-full p-4 bg-slate-50 border rounded-2xl text-2xl font-black text-red-900">
                    </div>
                    <div id="acc_list" class="space-y-2 bg-slate-50 p-4 rounded-xl border italic">
                        <p class="font-bold text-[10px] uppercase text-slate-400">Espaces d'Accueil</p>
                        <label class="flex gap-2 text-xs"><input type="checkbox" value="Hall Orient"> Hall Orient</label>
                        <label class="flex gap-2 text-xs"><input type="checkbox" value="Auditorium"> Auditorium</label>
                        <label class="flex gap-2 text-xs"><input type="checkbox" value="Table/Desk"> Table / Desk</label>
                    </div>
                    <div id="vest_list" class="space-y-2 bg-slate-50 p-4 rounded-xl border italic">
                        <p class="font-bold text-[10px] uppercase text-slate-400">Vestiaires</p>
                        <label class="flex gap-2 text-xs"><input type="checkbox" value="SAS Auditorium"> SAS Auditorium</label>
                        <label class="flex gap-2 text-xs"><input type="checkbox" value="Salle des Cadets"> Salle des Cadets</label>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="card-premium p-8 border-l-8 border-orange-500">
                    <h3 class="text-orange-700 font-black uppercase text-xs mb-4 italic">Mobilier Scène</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[9px] uppercase font-bold text-slate-400">Chaises (max 6)</label><input type="number" id="nb_chaises" max="6" value="0" class="w-full p-3 border rounded-xl font-bold"></div>
                        <div><label class="text-[9px] uppercase font-bold text-slate-400">Tables (max 3)</label><input type="number" id="nb_tables" max="3" value="0" class="w-full p-3 border rounded-xl font-bold"></div>
                    </div>
                </div>
                <div class="card-premium p-8 border-l-8 border-blue-600">
                    <h3 class="text-blue-800 font-black uppercase text-xs mb-4 italic">Technique</h3>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="text-[9px] uppercase font-bold text-slate-400">Mics HF (2 max)</label>
                            <input type="number" id="micros_hf" max="2" value="0" class="w-full p-3 border rounded-xl font-bold">
                        </div>
                        <div>
                            <label class="text-[9px] uppercase font-bold text-slate-400">Mics Filaires (6 max)</label>
                            <input type="number" id="micros_filaires" max="6" value="0" class="w-full p-3 border rounded-xl font-bold">
                        </div>
                    </div>
                    <div id="tech_opts" class="flex flex-wrap gap-4 text-[10px] font-black uppercase text-slate-600">
                        <label class="flex gap-2"><input type="checkbox" value="Visio"> Visio</label>
                        <label class="flex gap-2"><input type="checkbox" value="Captation"> Captation</label>
                        <label class="flex gap-2"><input type="checkbox" value="Record"> Record</label>
                    </div>
                </div>
            </div>

            <div class="card-premium p-8 border-l-8 border-amber-600 bg-amber-50/20">
                <h3 class="text-amber-800 font-black uppercase text-sm mb-4 italic">Salle des Cadets</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <label class="flex items-center gap-4 p-5 bg-amber-50 rounded-2xl border border-amber-100 cursor-pointer">
                        <input type="checkbox" id="cadets_retrans" class="w-6 h-6 accent-amber-700">
                        <span class="text-xs font-black uppercase text-amber-900">Retransmission Direct</span>
                    </label>
                    <textarea id="cadets_notes" placeholder="Notes Salle des Cadets..." class="w-full p-4 bg-slate-50 border rounded-2xl h-24 text-sm"></textarea>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full gradient-musee text-white py-6 rounded-full text-xl font-black uppercase tracking-[0.3em] shadow-2xl">Envoyer la fiche technique</button>
        </form>
    </div>

    <div id="vue-admin" class="hidden max-w-7xl mx-auto py-12 px-4 space-y-12">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 card-premium p-8">
                <h3 class="font-prestige text-red-900 mb-4 uppercase text-xs tracking-tighter">Activité Mensuelle</h3>
                <canvas id="chartMonths" height="120"></canvas>
            </div>
            <div class="card-premium p-8">
                <h3 class="font-prestige text-red-900 mb-4 uppercase text-xs tracking-tighter">Profil Moyen</h3>
                <canvas id="chartRadar"></canvas>
            </div>
        </div>
        <div id="admin-list" class="grid grid-cols-1 gap-6"></div>
    </div>

    <script>
        const S_URL = 'https://hecyorhhyidlfdluelit.supabase.co'; 
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlY3lvcmhoeWlkbGZkbHVlbGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5OTI3MDAsImV4cCI6MjA4MjU2ODcwMH0.KloEAEbI1hgP1yR4vU2in4QVgg4AkBqrTtisPb2fdes';
        const _supa = supabase.createClient(S_URL, S_KEY);
        let charts = {};

        document.getElementById('btn-auth-submit').addEventListener('click', async () => {
            const email = document.getElementById('adm-email').value;
            const password = document.getElementById('adm-pass').value;
            const { error } = await _supa.auth.signInWithPassword({ email, password });
            if (error) alert("Échec : " + error.message);
            else { document.getElementById('login-modal').style.display = 'none'; basculerVueAdmin(); }
        });

        function basculerVueAdmin() {
            document.getElementById('vue-client').classList.add('hidden');
            document.getElementById('vue-admin').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
            document.getElementById('btn-login-trigger').classList.add('hidden');
            chargerDonnees();
        }

        async function chargerDonnees() {
            const { data, error } = await _supa.from('demandes_auditorium').select('*').order('date_evenement', { ascending: true });
            if (data) { renderList(data); initCharts(data); }
        }

        function renderList(data) {
            document.getElementById('admin-list').innerHTML = data.map(d => `
                <div class="card-premium overflow-hidden border-t-4 border-red-900 shadow-xl">
                    <div class="p-6 bg-slate-50 flex justify-between items-center border-b">
                        <div>
                            <span class="bg-red-900 text-white px-3 py-1 rounded-full text-[10px] font-bold mr-3">${d.date_evenement}</span>
                            <span class="font-black uppercase text-xl text-slate-800">${d.nom_evenement}</span>
                            <p class="text-[10px] font-bold text-slate-400 uppercase mt-1 italic">${d.organisme} - ${d.point_contact}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="genererPDF('${d.id}')" class="bg-black text-white px-4 py-2 rounded-full text-[10px] font-black uppercase">PDF</button>
                            <button onclick="supprimerLigne('${d.id}')" class="text-red-600 border border-red-100 p-2 rounded-full hover:bg-red-50"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="p-6 grid grid-cols-1 md:grid-cols-4 gap-6 text-[11px]">
                        <div>
                            <p class="font-black text-red-900 uppercase italic mb-1 border-b">Logistique</p>
                            <p>Participants: <strong>${d.nb_participants}</strong></p>
                            <p>Accueil: ${d.lieux_accueil?.join(', ') || '/'}</p>
                        </div>
                        <div class="border-l pl-4">
                            <p class="font-black text-orange-600 uppercase italic mb-1 border-b">Mobilier</p>
                            <p>Chaises: <strong>${d.nb_chaises}</strong> | Tables: <strong>${d.nb_tables}</strong></p>
                        </div>
                        <div class="border-l pl-4">
                            <p class="font-black text-blue-600 uppercase italic mb-1 border-b">Technique</p>
                            <p>HF: <strong>${d.micros_hf_regie}</strong> | Fil: <strong>${d.micros_filaires_scene}</strong></p>
                        </div>
                        <div class="border-l pl-4 bg-amber-50 p-2 rounded-xl">
                            <p class="font-black text-amber-800 uppercase italic mb-1 border-b">Infos</p>
                            <p>Orga: ${d.heure_orga} | Public: ${d.heure_public}</p>
                            <p>Retrans Cadets: ${d.cadets_retransmission ? 'OUI' : 'NON'}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function supprimerLigne(id) {
            if(confirm("Supprimer ?")) {
                const { error } = await _supa.from('demandes_auditorium').delete().eq('id', id);
                if (!error) chargerDonnees();
            }
        }

        function initCharts(data) {
            const ctxBar = document.getElementById('chartMonths').getContext('2d');
            const months = Array(12).fill(0);
            data.forEach(d => { if(d.date_evenement) months[new Date(d.date_evenement).getMonth()]++; });
            if(charts.bar) charts.bar.destroy();
            charts.bar = new Chart(ctxBar, { type: 'bar', data: { labels: ['J','F','M','A','M','J','J','A','S','O','N','D'], datasets: [{ label: 'Événements', data: months, backgroundColor: '#7f1d1d' }] } });

            const ctxRadar = document.getElementById('chartRadar').getContext('2d');
            const avg = [
                data.reduce((a, b) => a + (b.micros_hf_regie || 0), 0) / (data.length || 1),
                data.reduce((a, b) => a + (b.micros_filaires_scene || 0), 0) / (data.length || 1),
                data.filter(d => d.options_tech?.includes('Visio')).length
            ];
            if(charts.radar) charts.radar.destroy();
            charts.radar = new Chart(ctxRadar, { type: 'radar', data: { labels: ['HF', 'Fil', 'Visio'], datasets: [{ label: 'Moyenne', data: avg, backgroundColor: 'rgba(127, 29, 29, 0.1)', borderColor: '#7f1d1d' }] } });
        }

        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;

            const payload = {
                organisme: document.getElementById('organisme').value,
                nom_evenement: document.getElementById('nom_evenement').value,
                point_contact: document.getElementById('point_contact').value,
                contact_email: document.getElementById('contact_email').value, 
                contact_tel: document.getElementById('contact_tel').value,
                date_evenement: document.getElementById('date_evenement').value,
                heure_orga: document.getElementById('heure_orga').value,
                heure_public: document.getElementById('heure_public').value,
                heure_fin: document.getElementById('heure_fin').value,
                nb_participants: parseInt(document.getElementById('nb_participants').value) || 0,
                lieux_accueil: Array.from(document.querySelectorAll('#acc_list input:checked')).map(i => i.value),
                lieux_vestiaire: Array.from(document.querySelectorAll('#vest_list input:checked')).map(i => i.value),
                nb_chaises: parseInt(document.getElementById('nb_chaises').value) || 0,
                nb_tables: parseInt(document.getElementById('nb_tables').value) || 0,
                micros_hf_regie: parseInt(document.getElementById('micros_hf').value) || 0,
                micros_filaires_scene: parseInt(document.getElementById('micros_filaires').value) || 0,
                options_tech: Array.from(document.querySelectorAll('#tech_opts input:checked')).map(i => i.value),
                cadets_retransmission: document.getElementById('cadets_retrans').checked,
                cadets_notes: document.getElementById('cadets_notes').value
            };

            const { error } = await _supa.from('demandes_auditorium').insert([payload]);
            if (!error) { alert("✓ Transmis !"); location.reload(); }
            else { alert("Erreur d'envoi : " + error.message); btn.disabled = false; }
        };

        function handleLogout() { _supa.auth.signOut(); location.reload(); }
        async function genererPDF(id) { /* PDF Logic Rétablie */ }
    </script>
</body>
</html>
