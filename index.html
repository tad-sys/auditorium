<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régie Auditorium - Musée de l'Armée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        :root { --primary: #7f1d1d; --accent: #d4af37; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; }
        .font-prestige { font-family: 'Cinzel', serif; }
        .gradient-musee { background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%); }
        .card-premium { 
            background: white; border-radius: 2rem; border: 1px solid #e2e8f0; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .card-premium:hover { transform: translateY(-8px); box-shadow: 0 30px 50px -12px rgba(127, 29, 29, 0.15); }
        .hidden { display: none !important; }
        #login-modal { 
            position: fixed; inset: 0; z-index: 9999; background: rgba(15, 23, 42, 0.9); 
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(12px); 
        }
        .status-badge { padding: 4px 12px; border-radius: 99px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .input-premium { 
            width: 100%; padding: 1rem; background: #f1f5f9; border: 2px solid transparent; 
            border-radius: 1rem; transition: all 0.3s; outline: none;
        }
        .input-premium:focus { border-color: #7f1d1d; background: white; box-shadow: 0 0 0 4px rgba(127, 29, 29, 0.1); }
    </style>
</head>
<body class="custom-scrollbar">

    <nav class="gradient-musee text-white p-6 shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-6">
                <div class="bg-white/10 p-4 rounded-2xl backdrop-blur-md border border-white/20">
                    <i class="fa-solid fa-building-columns text-amber-500 text-3xl"></i>
                </div>
                <div>
                    <h1 class="font-prestige text-2xl tracking-[0.2em] uppercase">Auditorium Austerlitz</h1>
                    <p class="text-[10px] uppercase font-black tracking-[0.3em] text-amber-500/90">Régie Technique - Musée de l'Armée</p>
                </div>
            </div>
            
            <div class="flex gap-4 items-center">
                <div id="admin-filters" class="hidden flex gap-3">
                    <select id="global-month-filter" onchange="appliquerFiltres()" class="bg-white/10 text-white border border-white/30 rounded-full px-6 py-3 text-xs font-black outline-none cursor-pointer hover:bg-white/20 transition-all">
                        <option value="all" class="text-black">Tous les événements</option>
                        <option value="01" class="text-black">Janvier</option><option value="02" class="text-black">Février</option>
                        <option value="03" class="text-black">Mars</option><option value="04" class="text-black">Avril</option>
                        <option value="05" class="text-black">Mai</option><option value="06" class="text-black">Juin</option>
                        <option value="07" class="text-black">Juillet</option><option value="08" class="text-black">Août</option>
                        <option value="09" class="text-black">Septembre</option><option value="10" class="text-black">Octobre</option>
                        <option value="11" class="text-black">Novembre</option><option value="12" class="text-black">Décembre</option>
                    </select>
                </div>
                <button onclick="document.getElementById('login-modal').style.display='flex'" id="btn-login-trigger" class="text-[10px] font-black uppercase border-2 border-amber-500/50 px-8 py-3 rounded-full hover:bg-amber-500 hover:text-red-950 transition-all">Accès Régisseur</button>
                <button id="btn-logout" onclick="location.reload()" class="hidden text-[10px] font-black uppercase bg-white text-red-900 px-8 py-3 rounded-full shadow-xl hover:bg-slate-100">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div id="vue-client" class="max-w-6xl mx-auto py-16 px-6 space-y-12">
        <form id="main-form" class="space-y-12">
            <div class="card-premium p-12 border-t-[15px] border-red-900 relative overflow-hidden">
                <div class="absolute -top-10 -right-10 text-[15rem] font-black text-slate-100 italic select-none">01</div>
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-10 border-b pb-6 flex items-center gap-4 italic relative z-10">
                    <i class="fa-solid fa-address-card text-3xl"></i> Informations de la manifestation
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-10 relative z-10">
                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-2 italic">Client / Organisme</label>
                        <input type="text" id="organisme" placeholder="Ex: Direction du Musée" required class="input-premium">
                    </div>
                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-2 italic">Nom de l'événement</label>
                        <input type="text" id="nom_evenement" placeholder="Ex: Assemblée Générale 2025" required class="input-premium">
                    </div>
                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-2 italic">Responsable</label>
                        <input type="text" id="point_contact" required class="input-premium">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-3">
                            <label class="text-[10px] font-black uppercase text-slate-400 ml-2 italic">Email</label>
                            <input type="email" id="contact_email" required class="input-premium">
                        </div>
                        <div class="space-y-3">
                            <label class="text-[10px] font-black uppercase text-slate-400 ml-2 italic">Téléphone</label>
                            <input type="tel" id="contact_tel" class="input-premium">
                        </div>
                    </div>
                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase text-red-900 ml-2 italic">Date de l'événement</label>
                        <input type="date" id="date_evenement" required class="w-full p-4 bg-red-50 border-2 border-red-100 rounded-2xl font-black text-red-900">
                    </div>
                    <div class="grid grid-cols-3 gap-4 bg-slate-900 p-6 rounded-[2rem] shadow-2xl">
                        <div class="text-center">
                            <label class="text-[9px] font-black uppercase text-amber-500 mb-2 block">Arrivée Orga</label>
                            <input type="time" id="heure_orga" required class="w-full bg-white/10 text-white p-3 rounded-xl border border-white/20 text-center font-bold">
                        </div>
                        <div class="text-center">
                            <label class="text-[9px] font-black uppercase text-amber-500 mb-2 block">Public</label>
                            <input type="time" id="heure_public" required class="w-full bg-white/10 text-white p-3 rounded-xl border border-white/20 text-center font-bold">
                        </div>
                        <div class="text-center">
                            <label class="text-[9px] font-black uppercase text-amber-500 mb-2 block">Fin</label>
                            <input type="time" id="heure_fin" required class="w-full bg-white/10 text-white p-3 rounded-xl border border-white/20 text-center font-bold">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-premium p-12">
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-10 border-b pb-6 flex items-center gap-4 italic">
                    <i class="fa-solid fa-couch text-3xl"></i> Configuration & Technique
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
                    <div class="space-y-8">
                        <div class="bg-slate-50 p-8 rounded-[2rem] border-2 border-slate-100 shadow-inner">
                            <label class="text-[11px] font-black text-slate-500 uppercase block mb-4">Participants (max 145)</label>
                            <input type="number" id="nb_participants" value="0" class="w-full bg-transparent text-5xl font-black text-red-900 outline-none">
                        </div>
                        <div class="flex items-center gap-4 p-6 bg-blue-50 rounded-2xl border-2 border-blue-100">
                            <input type="checkbox" id="wifi_public" class="w-6 h-6 accent-blue-600">
                            <span class="font-black text-xs uppercase text-blue-900 tracking-tighter">Wifi Public Inclus</span>
                        </div>
                    </div>

                    <div id="acc_list" class="space-y-4">
                        <p class="font-black text-xs uppercase text-red-900 border-l-4 border-red-900 pl-4 mb-6">Espaces</p>
                        <label class="flex items-center gap-4 p-4 hover:bg-slate-50 rounded-xl cursor-pointer transition-all border border-transparent hover:border-slate-200">
                            <input type="checkbox" value="Hall Orient" class="w-5 h-5 accent-red-900"> <span class="text-sm font-bold text-slate-700">Hall Orient</span>
                        </label>
                        <label class="flex items-center gap-4 p-4 hover:bg-slate-50 rounded-xl cursor-pointer transition-all border border-transparent hover:border-slate-200">
                            <input type="checkbox" value="Auditorium" class="w-5 h-5 accent-red-900"> <span class="text-sm font-bold text-slate-700">Auditorium</span>
                        </label>
                    </div>

                    <div class="space-y-6">
                         <p class="font-black text-xs uppercase text-red-900 border-l-4 border-red-900 pl-4 mb-6">Matériel Scène</p>
                         <div class="flex items-center justify-between bg-slate-50 p-4 rounded-xl">
                            <span class="text-xs font-black uppercase text-slate-500">Chaises</span>
                            <input type="number" id="nb_chaises" value="0" max="6" class="w-16 bg-white border-2 rounded-lg p-2 text-center font-black">
                         </div>
                         <div class="flex items-center justify-between bg-slate-50 p-4 rounded-xl">
                            <span class="text-xs font-black uppercase text-slate-500">Micros HF</span>
                            <input type="number" id="micros_hf" value="0" max="2" class="w-16 bg-white border-2 rounded-lg p-2 text-center font-black">
                         </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full gradient-musee text-white py-12 rounded-[3rem] text-4xl font-black uppercase tracking-[0.3em] shadow-2xl hover:scale-[1.02] active:scale-95 transition-all">Transmettre au régisseur</button>
        </form>
    </div>

    <div id="vue-admin" class="hidden max-w-7xl mx-auto py-16 px-6">
        <div class="flex justify-between items-end mb-12 border-b-4 border-red-900 pb-8">
            <div>
                <h2 class="font-prestige text-5xl text-red-950 uppercase tracking-tighter">Tableau de bord</h2>
                <p class="text-amber-600 font-black uppercase text-xs tracking-[0.5em] mt-2">Gestion des demandes techniques</p>
            </div>
            <div class="flex gap-4">
                <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-100 text-center min-w-[150px]">
                    <span class="block text-3xl font-black text-red-900" id="stat-total">0</span>
                    <span class="text-[9px] font-black uppercase text-slate-400">Total Manifestations</span>
                </div>
            </div>
        </div>
        
        <div id="admin-list" class="grid grid-cols-1 gap-8">
            </div>
    </div>

    <div id="login-modal">
        <div class="bg-white rounded-[4rem] p-16 max-w-md w-full shadow-2xl border-b-[20px] border-red-900 relative">
            <div class="text-center mb-10">
                <div class="inline-block p-6 bg-red-50 rounded-full mb-6">
                    <i class="fa-solid fa-lock text-4xl text-red-900"></i>
                </div>
                <h3 class="font-prestige text-3xl text-red-900 uppercase">Espace Sécurisé</h3>
            </div>
            <div class="space-y-6">
                <input type="email" id="adm-email" placeholder="Email Identifiant" class="input-premium">
                <input type="password" id="adm-pass" placeholder="Mot de passe" class="input-premium">
                <button type="button" id="btn-auth-submit" class="w-full gradient-musee text-white py-6 rounded-2xl font-black uppercase tracking-[0.2em] shadow-xl hover:shadow-red-900/20 transition-all">Connexion</button>
                <button onclick="document.getElementById('login-modal').style.display='none'" class="w-full text-[10px] font-black uppercase text-slate-400 hover:text-red-900 transition-all">Annuler</button>
            </div>
        </div>
    </div>

    <script>
        const S_URL = 'https://hecyorhhyidlfdluelit.supabase.co'; 
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlY3lvcmhoeWlkbGZkbHVlbGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5OTI3MDAsImV4cCI6MjA4MjU2ODcwMH0.KloEAEbI1hgP1yR4vU2in4QVgg4AkBqrTtisPb2fdes';
        const _supa = supabase.createClient(S_URL, S_KEY);
        let allEvents = [];

        // AUTHENTICATION
        document.getElementById('btn-auth-submit').addEventListener('click', async () => {
            const email = document.getElementById('adm-email').value;
            const password = document.getElementById('adm-pass').value;
            const { data, error } = await _supa.auth.signInWithPassword({ email, password });
            
            if (error) {
                alert("Erreur : " + error.message);
            } else {
                document.getElementById('login-modal').style.display = 'none';
                activerAdmin();
            }
        });

        async function activerAdmin() {
            document.getElementById('vue-client').classList.add('hidden');
            document.getElementById('vue-admin').classList.remove('hidden');
            document.getElementById('admin-filters').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
            document.getElementById('btn-login-trigger').classList.add('hidden');
            await chargerDonnees();
        }

        async function chargerDonnees() {
            const { data } = await _supa.from('demandes_auditorium').select('*').order('date_evenement', { ascending: true });
            if (data) {
                allEvents = data;
                document.getElementById('stat-total').innerText = data.length;
                appliquerFiltres();
            }
        }

        function appliquerFiltres() {
            const mois = document.getElementById('global-month-filter').value;
            let filtered = allEvents;
            if (mois !== 'all') {
                filtered = allEvents.filter(d => d.date_evenement && d.date_evenement.split('-')[1] === mois);
            }
            renderList(filtered);
        }

        // LE DASHBOARD RECOMPLEXIFIÉ (TOUS LES DÉTAILS)
        function renderList(data) {
            const container = document.getElementById('admin-list');
            if (data.length === 0) {
                container.innerHTML = `<div class="p-20 text-center bg-white rounded-[3rem] border-2 border-dashed border-slate-200 text-slate-400 font-black uppercase tracking-widest italic">Aucun dossier pour cette période</div>`;
                return;
            }

            container.innerHTML = data.map(d => `
                <div class="card-premium overflow-hidden border-l-[16px] border-red-900 group">
                    <div class="p-10 flex flex-col lg:flex-row items-start lg:items-center gap-10">
                        <div class="bg-red-900 text-white p-6 rounded-[2rem] text-center min-w-[160px] shadow-2xl group-hover:scale-105 transition-transform">
                            <span class="block text-xs font-black uppercase opacity-60 mb-1">Session</span>
                            <span class="block text-3xl font-black tracking-tighter">${d.date_evenement ? d.date_evenement.split('-').reverse().slice(0,2).join('/') : '??/??'}</span>
                            <div class="mt-4 pt-4 border-t border-white/20">
                                <span class="block text-[10px] font-black uppercase italic text-amber-500">${d.heure_orga} — ${d.heure_fin}</span>
                            </div>
                        </div>

                        <div class="flex-grow space-y-4">
                            <div>
                                <h3 class="font-prestige text-2xl text-slate-900 uppercase tracking-tight">${d.nom_evenement}</h3>
                                <p class="text-red-900 font-black text-xs uppercase italic tracking-widest mt-1">${d.organisme}</p>
                            </div>
                            
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <span class="block text-[8px] font-black text-slate-400 uppercase">Participants</span>
                                    <span class="text-sm font-bold text-slate-700">${d.nb_participants || 0}</span>
                                </div>
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <span class="block text-[8px] font-black text-slate-400 uppercase">Micros HF / Fil</span>
                                    <span class="text-sm font-bold text-slate-700">${d.micros_hf || 0} / ${d.micros_filaires || 0}</span>
                                </div>
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <span class="block text-[8px] font-black text-slate-400 uppercase">Mobilier</span>
                                    <span class="text-sm font-bold text-slate-700">${d.nb_chaises || 0}C / ${d.nb_tables || 0}T</span>
                                </div>
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <span class="block text-[8px] font-black text-slate-400 uppercase">Internet</span>
                                    <span class="text-sm font-bold ${d.wifi_public ? 'text-blue-600' : 'text-slate-400'}">${d.wifi_public ? 'OUI (Public)' : 'NON'}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col gap-3 min-w-[220px]">
                            <button onclick="genererPDF('${d.id}')" class="gradient-musee text-white p-5 rounded-2xl text-[10px] font-black uppercase flex items-center justify-center gap-3 shadow-xl hover:shadow-red-900/30 transition-all">
                                <i class="fa-solid fa-file-pdf text-xl text-amber-500"></i> Exporter Fiche Complète
                            </button>
                            <a href="mailto:${d.contact_email}" class="bg-white border-2 border-slate-100 text-slate-600 p-4 rounded-2xl text-[10px] font-black uppercase flex items-center justify-center gap-3 hover:bg-slate-50 transition-all">
                                <i class="fa-solid fa-paper-plane text-red-900"></i> Contacter
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // PDF HAUTE FIDÉLITÉ 2 PAGES (BESOINS + DÉROULÉ)
        window.genererPDF = function(id) {
            const d = allEvents.find(item => item.id === id);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // --- PAGE 1 : EXPRESSION DES BESOINS ---
            doc.setFont("helvetica", "bold"); doc.setFontSize(10);
            doc.text("Musée de l'Armée - Invalides", 15, 15);
            doc.setFontSize(16); doc.setTextColor(127, 29, 29);
            doc.text("AUDITORIUM AUSTERLITZ", 105, 25, { align: "center" });
            doc.setFontSize(11); doc.setTextColor(60);
            doc.text("Fiche technique - Expression des besoins", 105, 32, { align: "center" });
            
            doc.setFontSize(9); doc.setTextColor(0); doc.setFont("helvetica", "normal");
            doc.text("RDV technique : Non", 15, 45);
            
            const content = [
                ["Client / Organisme", d.organisme || ''],
                ["Manifestation", d.nom_evenement || ''],
                ["Date(s)", d.date_evenement || ''],
                ["Point de contact", d.point_contact || ''],
                ["Courriel", d.contact_email || ''],
                ["Téléphone", d.contact_tel || '']
            ];
            
            content.forEach((row, i) => {
                doc.setFont("helvetica", "bold"); doc.text(row[0] + " :", 15, 55 + (i*8));
                doc.setFont("helvetica", "normal"); doc.text(String(row[1]), 55, 55 + (i*8));
            });

            doc.setFont("helvetica", "bold");
            doc.text(`Heure arrivée organisateur : ${d.heure_orga || '....'}`, 15, 105);
            doc.setFontSize(7); doc.text("ouverture des portes - min. 30 minutes avant l'arrivée des participants", 15, 108);
            
            doc.setFontSize(9);
            doc.text(`Heure arrivée participants : ${d.heure_public || '....'}`, 15, 115);
            doc.text(`Départ participants : ${d.heure_fin || '....'}`, 110, 115);
            doc.text(`Fin de la prestation : ${d.heure_fin || '....'}`, 15, 122);

            // Blocs techniques
            doc.setFillColor(240, 240, 240); doc.rect(15, 135, 180, 7, 'F');
            doc.setFont("helvetica", "bold"); doc.text("SALLE / SCÈNE", 18, 140);
            doc.setFont("helvetica", "normal");
            doc.text(`Participants : ${d.nb_participants || 0} (max 145)`, 15, 150);
            doc.text(`Mobilier : ${d.nb_chaises || 0} Chaises / ${d.nb_tables || 0} Tables`, 110, 150);

            doc.setFillColor(240, 240, 240); doc.rect(15, 165, 180, 7, 'F');
            doc.setFont("helvetica", "bold"); doc.text("RÉGIE & ACCUEIL", 18, 170);
            doc.setFont("helvetica", "normal");
            doc.text(`Espaces : ${(d.lieux_accueil || ['Standard']).join(', ')}`, 15, 180);
            doc.text(`Matériel : HF (${d.micros_hf || 0}) / Fil (${d.micros_filaires || 0}) / Wifi (${d.wifi_public ? 'OUI' : 'NON'})`, 15, 187);

            // RGPD Mention
            doc.setFontSize(6); doc.setTextColor(100);
            const rgpd = "Conformément au RGPD, les données collectées sont destinées au département des locations d'espaces du Musée de l'Armée. Elles sont supprimées une fois l'événement terminé. Droits d'accès : rgpd@musee-armee.fr";
            doc.text(rgpd, 15, 280, { maxWidth: 180 });

            // --- PAGE 2 : MODÈLE DÉROULÉ ---
            doc.addPage();
            doc.setTextColor(0); doc.setFontSize(10); doc.setFont("helvetica", "bold");
            doc.text("AUDITORIUM AUSTERLITZ - Fiche modèle déroulé", 105, 20, { align: "center" });
            doc.setFontSize(9);
            doc.text(`Évènement : ${d.nom_evenement}`, 15, 35);
            doc.text(`Date : ${d.date_evenement}`, 15, 41);
            
            doc.autoTable({
                startY: 50,
                head: [['Heure', 'Durée', 'Séquence', 'Intervenant(s)', 'Projection', 'Commentaires']],
                body: Array(14).fill(['', '', '', '', '', '']),
                theme: 'grid',
                headStyles: { fillColor: [127, 29, 29], fontSize: 8, fontStyle: 'bold' },
                styles: { fontSize: 8, cellPadding: 4 }
            });

            doc.save(`Fiche_Technique_${d.nom_evenement}.pdf`);
        };

        // ENVOI FORMULAIRE
        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = "TRANSMISSION EN COURS...";
            btn.disabled = true;

            const payload = {
                organisme: document.getElementById('organisme').value,
                nom_evenement: document.getElementById('nom_evenement').value,
                point_contact: document.getElementById('point_contact').value,
                contact_email: document.getElementById('contact_email').value,
                contact_tel: document.getElementById('contact_tel').value,
                date_evenement: document.getElementById('date_evenement').value,
                heure_orga: document.getElementById('heure_orga').value,
                heure_public: document.getElementById('heure_public').value,
                heure_fin: document.getElementById('heure_fin').value,
                nb_participants: parseInt(document.getElementById('nb_participants').value) || 0,
                wifi_public: document.getElementById('wifi_public').checked,
                lieux_accueil: Array.from(document.querySelectorAll('#acc_list input:checked')).map(i => i.value),
                nb_chaises: parseInt(document.getElementById('nb_chaises').value) || 0,
                micros_hf: parseInt(document.getElementById('micros_hf').value) || 0
            };

            const { error } = await _supa.from('demandes_auditorium').insert([payload]);
            if (error) {
                alert("Erreur base de données : " + error.message);
                btn.innerText = "RÉESSAYER";
                btn.disabled = false;
            } else {
                alert("Votre demande a été transmise avec succès à la régie.");
                location.reload();
            }
        };
    </script>
</body>
