<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régie Auditorium - Musée de l'Armée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        :root { --primary: #7f1d1d; --accent: #d4af37; }
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; }
        .font-prestige { font-family: 'Cinzel', serif; }
        .gradient-musee { background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%); }
        .card-premium { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        .card-premium:hover { transform: translateY(-5px); }
        .hidden { display: none !important; }
        #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    </style>
</head>
<body>

    <nav class="gradient-musee text-white p-6 shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-5">
                <div class="bg-white/10 p-3 rounded-2xl">
                    <i class="fa-solid fa-building-columns text-amber-500 text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-prestige text-xl tracking-[0.2em] uppercase">Auditorium Austerlitz</h1>
                    <p class="text-[9px] uppercase font-black tracking-widest text-amber-500/80">Régie Technique - Musée de l'Armée</p>
                </div>
            </div>
            
            <div class="flex gap-4 items-center">
                <div id="admin-filters" class="hidden flex gap-2">
                    <select id="global-month-filter" onchange="chargerDonnees()" class="bg-white/10 text-white border border-white/30 rounded-full px-5 py-2.5 text-xs font-black cursor-pointer">
                        <option value="all" class="text-black">Tous les mois</option>
                        <option value="01" class="text-black">Janvier</option><option value="02" class="text-black">Février</option>
                        <option value="03" class="text-black">Mars</option><option value="04" class="text-black">Avril</option>
                        <option value="05" class="text-black">Mai</option><option value="06" class="text-black">Juin</option>
                        <option value="07" class="text-black">Juillet</option><option value="08" class="text-black">Août</option>
                        <option value="09" class="text-black">Septembre</option><option value="10" class="text-black">Octobre</option>
                        <option value="11" class="text-black">Novembre</option><option value="12" class="text-black">Décembre</option>
                    </select>
                </div>
                <button onclick="document.getElementById('login-modal').style.display='flex'" id="btn-login-trigger" class="text-[10px] font-black uppercase border border-white/40 px-6 py-2.5 rounded-full">Accès Régisseur</button>
                <button id="btn-logout" onclick="location.reload()" class="hidden text-[10px] font-black uppercase bg-white text-red-900 px-6 py-2.5 rounded-full">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div id="vue-client" class="max-w-5xl mx-auto py-12 px-4 space-y-10">
        <form id="main-form" class="space-y-10">
            <div class="card-premium p-10 border-t-[12px] border-red-900">
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-8 border-b pb-4 italic flex items-center gap-3">
                    <i class="fa-solid fa-address-card text-2xl"></i> Identification & Contact
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <input type="text" id="organisme" placeholder="Client / Organisme" required class="w-full p-4 bg-slate-50 border-2 rounded-2xl">
                    <input type="text" id="nom_evenement" placeholder="Nom de l'événement" required class="w-full p-4 bg-slate-50 border-2 rounded-2xl">
                    <input type="text" id="point_contact" placeholder="Responsable" required class="w-full p-4 bg-slate-50 border-2 rounded-2xl">
                    <input type="email" id="contact_email" placeholder="Email" required class="w-full p-4 bg-slate-50 border-2 rounded-2xl">
                    <input type="date" id="date_evenement" required class="w-full p-4 bg-red-50/30 border-2 border-red-100 rounded-2xl font-bold">
                    <div class="grid grid-cols-3 gap-4 bg-slate-900 p-6 rounded-3xl">
                        <input type="time" id="heure_orga" required class="p-3 bg-white/10 text-white rounded-xl text-center" title="Arrivée Orga">
                        <input type="time" id="heure_public" required class="p-3 bg-white/10 text-white rounded-xl text-center" title="Public">
                        <input type="time" id="heure_fin" required class="p-3 bg-white/10 text-white rounded-xl text-center" title="Fin">
                    </div>
                </div>
            </div>
            <button type="submit" class="w-full gradient-musee text-white py-10 rounded-[2.5rem] text-3xl font-black uppercase shadow-2xl">Transmettre</button>
        </form>
    </div>

    <div id="vue-admin" class="hidden max-w-7xl mx-auto py-12 px-4 space-y-12">
        <div id="admin-list" class="grid grid-cols-1 gap-8"></div>
    </div>

    <div id="login-modal">
        <div class="bg-white rounded-[3rem] p-12 max-w-md w-full shadow-2xl border-4 border-red-900">
            <h3 class="font-prestige text-2xl text-center text-red-900 mb-8">Espace Régie</h3>
            <div class="space-y-6">
                <input type="email" id="adm-email" placeholder="Email" class="w-full p-5 bg-slate-50 border-2 rounded-2xl">
                <input type="password" id="adm-pass" placeholder="Mot de passe" class="w-full p-5 bg-slate-50 border-2 rounded-2xl">
                <button type="button" id="btn-auth-submit" class="w-full gradient-musee text-white py-6 rounded-2xl font-black uppercase">Se connecter</button>
            </div>
        </div>
    </div>

    <script>
        const S_URL = 'https://hecyorhhyidlfdluelit.supabase.co'; 
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlY3lvcmhoeWlkbGZkbHVlbGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5OTI3MDAsImV4cCI6MjA4MjU2ODcwMH0.KloEAEbI1hgP1yR4vU2in4QVgg4AkBqrTtisPb2fdes';
        const _supa = supabase.createClient(S_URL, S_KEY);
        let allEvents = [];

        // AUTHENTIFICATION STRICTE
        document.getElementById('btn-auth-submit').addEventListener('click', async () => {
            const email = document.getElementById('adm-email').value;
            const password = document.getElementById('adm-pass').value;
            
            const { data, error } = await _supa.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert("Erreur d'authentification : " + error.message);
            } else {
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('vue-client').classList.add('hidden');
                document.getElementById('vue-admin').classList.remove('hidden');
                document.getElementById('admin-filters').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                document.getElementById('btn-login-trigger').classList.add('hidden');
                chargerDonnees();
            }
        });

        async function chargerDonnees() {
            const mois = document.getElementById('global-month-filter').value;
            const { data, error } = await _supa.from('demandes_auditorium').select('*').order('date_evenement', { ascending: true });
            
            if (data) {
                allEvents = data;
                const filtered = mois === 'all' ? data : data.filter(d => d.date_evenement.split('-')[1] === mois);
                renderList(filtered);
            }
        }

        // 2. DASHBOARD AVEC HEURE DE FIN
        function renderList(data) {
            document.getElementById('admin-list').innerHTML = data.map(d => `
                <div class="card-premium overflow-hidden border-t-8 border-red-900">
                    <div class="p-8 bg-slate-50 flex justify-between items-center">
                        <div class="flex gap-6 items-center">
                            <div class="text-center bg-red-900 text-white p-4 rounded-2xl min-w-[120px]">
                                <span class="block text-xl font-black">${d.date_evenement}</span>
                                <span class="block text-[10px] font-bold opacity-80 mt-1">${d.heure_orga} - ${d.heure_fin}</span>
                            </div>
                            <div>
                                <h2 class="font-prestige text-2xl text-slate-800">${d.nom_evenement}</h2>
                                <p class="text-xs font-black uppercase text-red-900 italic">${d.organisme}</p>
                            </div>
                        </div>
                        <button onclick="genererPDF('${d.id}')" class="bg-slate-900 text-white px-8 py-4 rounded-2xl text-[10px] font-black uppercase flex items-center gap-2">
                            <i class="fa-solid fa-file-pdf"></i> Exporter PDF Fidèle
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 3. PDF HAUTE FIDÉLITÉ (2 PAGES)
        window.genererPDF = function(id) {
            const d = allEvents.find(item => item.id === id);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // PAGE 1 : EXPRESSION DES BESOINS
            doc.setFont("helvetica", "bold");
            doc.text("Musée de l'Armée - Invalides", 15, 15);
            doc.setFontSize(14);
            doc.text("AUDITORIUM AUSTERLITZ", 105, 25, { align: "center" });
            doc.setFontSize(11);
            doc.text("Fiche technique - Expression des besoins", 105, 32, { align: "center" });
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text("RDV technique : Non", 15, 42);
            doc.text(`Client / Organisme : ${d.organisme || ''}`, 15, 52);
            doc.text(`Manifestation : ${d.nom_evenement || ''}`, 15, 59);
            doc.text(`Date(s) : ${d.date_evenement || ''}`, 15, 66);
            doc.text(`Point de contact : ${d.point_contact || ''}`, 15, 73);
            doc.text(`Heure arrivée organisateur : ${d.heure_orga || ''}`, 15, 83);
            doc.text(`Heure arrivée participants : ${d.heure_public || ''}`, 15, 90);
            doc.text(`Départ participants : ${d.heure_fin || ''}`, 110, 90);
            doc.text(`Fin de la prestation : ${d.heure_fin || ''}`, 15, 97);

            doc.setFillColor(240, 240, 240);
            doc.rect(15, 110, 180, 6, 'F');
            doc.setFont("helvetica", "bold");
            doc.text("SALLE / SCÈNE", 17, 114.5);
            doc.setFont("helvetica", "normal");
            doc.text(`${d.nb_participants || 0} PARTICIPANTS (max 145)`, 15, 122);

            doc.setFontSize(6);
            doc.text("Le musée de l'Armée met en œuvre un traitement de données... Droits d'accès : rgpd@musee-armee.fr", 15, 280, { maxWidth: 180 });

            // PAGE 2 : GRILLE DE DÉROULÉ
            doc.addPage();
            doc.setFontSize(10);
            doc.setFont("helvetica", "bold");
            doc.text("AUDITORIUM AUSTERLITZ - Fiche modèle déroulé", 105, 20, { align: "center" });
            doc.text("Evénement : " + d.nom_evenement, 15, 35);
            
            doc.autoTable({
                startY: 45,
                head: [['Heure', 'Durée', 'Séquence', 'Intervenant(s)', 'Projection', 'Commentaires']],
                body: Array(10).fill(['', '', '', '', '', '']),
                theme: 'grid',
                headStyles: { fillColor: [127, 29, 29] }
            });

            doc.save(`Fiche_${d.nom_evenement}.pdf`);
        };

        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                organisme: document.getElementById('organisme').value,
                nom_evenement: document.getElementById('nom_evenement').value,
                point_contact: document.getElementById('point_contact').value,
                contact_email: document.getElementById('contact_email').value,
                date_evenement: document.getElementById('date_evenement').value,
                heure_orga: document.getElementById('heure_orga').value,
                heure_public: document.getElementById('heure_public').value,
                heure_fin: document.getElementById('heure_fin').value
            };
            const { error } = await _supa.from('demandes_auditorium').insert([payload]);
            if (error) alert("Erreur"); else { alert("Transmis !"); location.reload(); }
        };
    </script>
</body>
</html>
