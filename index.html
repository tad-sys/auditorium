<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régie Auditorium - Musée de l'Armée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; }
        .font-prestige { font-family: 'Cinzel', serif; }
        .gradient-musee { background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%); }
        .card-premium { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        #login-modal, #planning-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100000; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: white; border: 1px solid #e2e8f0; }
        .calendar-day { min-height: 100px; border: 0.5px solid #f1f5f9; padding: 5px; }
        .event-bar { background: #7f1d1d; color: white; font-size: 9px; padding: 2px 4px; border-radius: 3px; margin-top: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <nav class="gradient-musee text-white p-5 shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-building-columns text-amber-500 text-2xl"></i>
                <h1 class="font-prestige text-xl tracking-widest uppercase">Auditorium Austerlitz</h1>
            </div>
            <div class="flex gap-3">
                <button id="btn-open-planning" onclick="ouvrirPlanning()" class="hidden bg-amber-500 text-white px-6 py-2 rounded-full text-[10px] font-black uppercase shadow-lg hover:bg-amber-600 transition-all">Planning Outlook</button>
                <button onclick="document.getElementById('login-modal').style.display='flex'" id="btn-login-trigger" class="text-[10px] font-black uppercase border border-white/40 px-6 py-2 rounded-full hover:bg-white/20 transition-all cursor-pointer">Accès Régisseur</button>
                <button id="btn-logout" onclick="handleLogout()" class="hidden text-[10px] font-black uppercase bg-white text-red-900 px-6 py-2 rounded-full shadow-lg hover:bg-slate-100 transition-all">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div id="planning-modal">
        <div class="bg-white rounded-3xl w-[95%] h-[90vh] flex flex-col shadow-2xl overflow-hidden border-4 border-red-900">
            <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <h3 id="cal-month-title" class="font-prestige text-xl text-red-900 italic">Planning</h3>
                    <div class="flex bg-white border rounded-lg">
                        <button onclick="navCal(-1)" class="px-3 py-1 border-r hover:bg-slate-100"><i class="fa-solid fa-chevron-left"></i></button>
                        <button onclick="navCal(1)" class="px-3 py-1 hover:bg-slate-100"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="flex gap-2">
                    <select id="cal-view-type" onchange="renderOutlook()" class="text-[10px] font-black uppercase border px-4 py-2 rounded-xl">
                        <option value="hebdo">Hebdomadaire</option>
                        <option value="mois" selected>Mensuel</option>
                        <option value="trimestre">Trimestriel</option>
                        <option value="an">Annuel</option>
                    </select>
                    <button onclick="document.getElementById('planning-modal').style.display='none'" class="text-slate-400 hover:text-red-900 text-2xl"><i class="fa-solid fa-circle-xmark"></i></button>
                </div>
            </div>
            <div id="calendar-body" class="flex-1 overflow-y-auto p-4 bg-slate-100">
                </div>
        </div>
    </div>

    <div id="vue-client" class="max-w-5xl mx-auto py-12 px-4 space-y-8">
        <form id="main-form" class="space-y-8">
            <div class="card-premium p-8 border-t-8 border-red-900">
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-6 border-b pb-2 italic">Identification & Contact</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="text" id="organisme" placeholder="Organisme / Client" required class="w-full p-4 bg-slate-50 border rounded-2xl">
                    <input type="text" id="nom_evenement" placeholder="Nom de l'événement" required class="w-full p-4 bg-slate-50 border rounded-2xl">
                    <input type="text" id="point_contact" placeholder="Responsable" required class="w-full p-4 bg-slate-50 border rounded-2xl">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="email" id="contact_email" placeholder="Email" required class="w-full p-4 bg-slate-50 border rounded-2xl">
                        <input type="tel" id="contact_tel" placeholder="Téléphone" class="w-full p-4 bg-slate-50 border rounded-2xl">
                    </div>
                    <div>
                        <label class="text-[11px] font-black uppercase text-slate-500 ml-2">Date</label>
                        <input type="date" id="date_evenement" required class="w-full p-4 bg-slate-50 border rounded-2xl">
                    </div>
                    <div class="grid grid-cols-3 gap-2 bg-red-50 p-4 rounded-2xl">
                        <input type="time" id="heure_orga" required class="p-2 rounded-xl text-center" title="Arrivée Orga">
                        <input type="time" id="heure_public" required class="p-2 rounded-xl text-center" title="Accueil Public">
                        <input type="time" id="heure_fin" required class="p-2 rounded-xl text-center" title="Fin Event">
                    </div>
                </div>
            </div>

            <div class="card-premium p-8">
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-6 border-b pb-2 italic">Accueil & Logistique</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase">Participants</label>
                        <input type="number" id="nb_participants" class="w-full p-6 bg-slate-50 border-2 rounded-3xl text-3xl font-black text-center">
                        <label class="flex items-center gap-3 mt-4"><input type="checkbox" id="wifi_public"> <span class="text-xs font-bold uppercase">Wifi Public</span></label>
                    </div>
                    <div id="acc_list" class="space-y-2 bg-slate-50 p-4 rounded-2xl">
                        <p class="font-black text-[10px] uppercase text-red-900 border-b">Espaces</p>
                        <label class="flex gap-2 text-xs"><input type="checkbox" value="Hall Orient"> Hall Orient</label>
                        <label class="flex gap-2 text-xs"><input type="checkbox" value="Auditorium"> Auditorium</label>
                        <label class="flex gap-2 text-xs"><input type="checkbox" value="Table/Desk"> Table / Desk</label>
                    </div>
                    <div id="vest_list" class="space-y-2 bg-slate-50 p-4 rounded-2xl">
                        <p class="font-black text-[10px] uppercase text-red-900 border-b">Vestiaires</p>
                        <label class="flex gap-2 text-xs"><input type="checkbox" value="SAS Auditorium"> SAS Auditorium</label>
                        <label class="flex gap-2 text-xs"><input type="checkbox" value="Salle des Cadets"> Salle des Cadets</label>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="card-premium p-8 border-l-[12px] border-orange-500">
                    <h3 class="text-orange-700 font-black text-xs uppercase mb-4 italic">Mobilier Scène</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="nb_chaises" placeholder="Chaises" class="p-4 border rounded-2xl">
                        <input type="number" id="nb_tables" placeholder="Tables" class="p-4 border rounded-2xl">
                    </div>
                </div>
                <div class="card-premium p-8 border-l-[12px] border-blue-600">
                    <h3 class="text-blue-800 font-black text-xs uppercase mb-4 italic">Moyens Techniques</h3>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <input type="number" id="micros_hf" placeholder="Micros HF" class="p-4 border rounded-2xl">
                        <input type="number" id="micros_filaires" placeholder="Micros Fil" class="p-4 border rounded-2xl">
                    </div>
                    <div id="tech_opts" class="flex flex-wrap gap-2 text-[10px] font-black uppercase">
                        <label class="bg-blue-50 p-2 rounded border"><input type="checkbox" value="Visio"> Visio</label>
                        <label class="bg-blue-50 p-2 rounded border"><input type="checkbox" value="Captation"> Captation</label>
                        <label class="bg-blue-50 p-2 rounded border"><input type="checkbox" value="Record"> Record</label>
                    </div>
                </div>
            </div>

            <div class="card-premium p-8 border-l-[12px] border-amber-600 bg-amber-50/20">
                <h3 class="text-amber-800 font-black uppercase text-sm mb-4 italic">Salle des Cadets</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <label class="flex items-center gap-4 bg-white p-4 rounded-2xl border cursor-pointer">
                        <input type="checkbox" id="cadets_retrans" class="w-6 h-6">
                        <span class="text-[10px] font-black uppercase">Retransmission Direct</span>
                    </label>
                    <textarea id="cadets_notes" placeholder="Notes spécifiques..." class="w-full p-4 rounded-2xl h-24 border outline-none"></textarea>
                </div>
            </div>

            <button type="submit" class="w-full gradient-musee text-white py-8 rounded-full text-2xl font-black uppercase tracking-widest shadow-2xl">Envoyer la fiche technique</button>
        </form>
    </div>

    <div id="vue-admin" class="hidden max-w-7xl mx-auto py-12 px-4 space-y-12">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 card-premium p-8">
                <h3 id="year-title" class="font-prestige text-red-900 mb-6 italic underline">Activité Mensuelle</h3>
                <canvas id="chartMonths" height="120"></canvas>
            </div>
            <div class="card-premium p-8">
                <h3 class="font-prestige text-red-900 text-sm mb-4 italic">Radar des Besoins</h3>
                <canvas id="chartRadar"></canvas>
            </div>
        </div>
        <div id="admin-list" class="grid grid-cols-1 gap-6"></div>
    </div>

    <div id="login-modal">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full border-4 border-red-900">
            <h3 class="font-prestige text-xl text-center mb-6 text-red-900 italic">Identification Régie</h3>
            <input type="email" id="adm-email" placeholder="Email" class="w-full p-4 bg-slate-50 border rounded-2xl mb-4">
            <input type="password" id="adm-pass" placeholder="Mot de passe" class="w-full p-4 bg-slate-50 border rounded-2xl mb-6">
            <button id="btn-auth-submit" class="w-full gradient-musee text-white py-4 rounded-2xl font-black uppercase">Connexion</button>
            <button onclick="document.getElementById('login-modal').style.display='none'" class="w-full text-slate-400 text-[10px] mt-4 uppercase font-black">Annuler</button>
        </div>
    </div>

    <script>
        const S_URL = 'https://hecyorhhyidlfdluelit.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlY3lvcmhoeWlkbGZkbHVlbGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5OTI3MDAsImV4cCI6MjA4MjU2ODcwMH0.KloEAEbI1hgP1yR4vU2in4QVgg4AkBqrTtisPb2fdes';
        const _supa = supabase.createClient(S_URL, S_KEY);
        let charts = {}, currentData = [], viewDate = new Date();

        // --- AUTH & DATA ---
        document.getElementById('btn-auth-submit').onclick = async () => {
            const { error } = await _supa.auth.signInWithPassword({ 
                email: document.getElementById('adm-email').value, 
                password: document.getElementById('adm-pass').value 
            });
            if (!error) { 
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('vue-client').classList.add('hidden');
                document.getElementById('vue-admin').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                document.getElementById('btn-open-planning').classList.remove('hidden');
                charger();
            } else alert("Erreur");
        };

        async function charger() {
            const { data } = await _supa.from('demandes_auditorium').select('*').order('date_evenement');
            currentData = data || [];
            renderList(currentData);
            initCharts(currentData);
        }

        // --- PLANNING OUTLOOK FILTRÉ ---
        function ouvrirPlanning() {
            document.getElementById('planning-modal').style.display = 'flex';
            renderOutlook();
        }

        function navCal(dir) {
            const type = document.getElementById('cal-view-type').value;
            if(type === 'mois') viewDate.setMonth(viewDate.getMonth() + dir);
            else if(type === 'hebdo') viewDate.setDate(viewDate.getDate() + (dir * 7));
            else if(type === 'an') viewDate.setFullYear(viewDate.getFullYear() + dir);
            else viewDate.setMonth(viewDate.getMonth() + (dir * 3));
            renderOutlook();
        }

        function renderOutlook() {
            const container = document.getElementById('calendar-body');
            const type = document.getElementById('cal-view-type').value;
            container.innerHTML = '';
            
            document.getElementById('cal-month-title').innerText = viewDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }).toUpperCase();

            // Création de la grille (Mode Mensuel par défaut)
            const grid = document.createElement('div');
            grid.className = "calendar-grid";
            
            // Logique de filtrage par période
            let daysToShow = 31;
            if(type === 'hebdo') daysToShow = 7;
            if(type === 'an') { /* Vue simplifiée annuelle */ }

            const start = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
            for(let i=1; i<=31; i++) {
                const d = new Date(viewDate.getFullYear(), viewDate.getMonth(), i);
                if(d.getMonth() !== viewDate.getMonth()) break;
                
                const dateStr = d.toISOString().split('T')[0];
                const events = currentData.filter(e => e.date_evenement === dateStr);
                
                const dayEl = document.createElement('div');
                dayEl.className = "calendar-day bg-white";
                dayEl.innerHTML = `<span class="text-[10px] font-bold text-slate-400">${i}</span>`;
                
                events.forEach(ev => {
                    const evEl = document.createElement('div');
                    evEl.className = "event-bar";
                    evEl.innerText = ev.nom_evenement;
                    evEl.onclick = () => {
                        document.getElementById('planning-modal').style.display = 'none';
                        const target = document.getElementById(`card-${ev.id}`);
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        target.classList.add('ring-4', 'ring-amber-400');
                        setTimeout(() => target.classList.remove('ring-4', 'ring-amber-400'), 2000);
                    };
                    dayEl.appendChild(evEl);
                });
                grid.appendChild(dayEl);
            }
            container.appendChild(grid);
        }

        // --- LISTE ADMIN & PDF [cite: 49-72, 88-93] ---
        function renderList(data) {
            document.getElementById('admin-list').innerHTML = data.map(d => `
                <div id="card-${d.id}" class="card-premium overflow-hidden border-t-4 border-red-900">
                    <div class="p-4 bg-slate-50 flex justify-between items-center border-b">
                        <span class="font-black text-xs uppercase">${d.date_evenement} | ${d.nom_evenement}</span>
                        <div class="flex gap-2">
                            <button onclick="genererPDF('${d.id}')" class="bg-black text-white px-4 py-1 rounded text-[10px] font-black uppercase">PDF</button>
                            <button onclick="supprimerLigne('${d.id}')" class="text-red-600"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="p-4 grid grid-cols-3 text-[10px] gap-4">
                        <div><b>Client:</b> ${d.organisme}<br><b>Contact:</b> ${d.point_contact}</div>
                        <div><b>Technique:</b> ${d.micros_hf_regie} HF / ${d.micros_filaires_scene} Fil<br><b>Mobilier:</b> ${d.nb_chaises} Chaises</div>
                        <div><b>Horaires:</b> ${d.heure_orga} - ${d.heure_fin}<br><b>Pax:</b> ${d.nb_participants}</div>
                    </div>
                </div>
            `).join('');
        }

        // --- CHARTS & FORM [cite: 74-87, 94-103] ---
        function initCharts(data) {
            const ctxBar = document.getElementById('chartMonths').getContext('2d');
            const counts = Array(12).fill(0);
            data.forEach(d => counts[new Date(d.date_evenement).getMonth()]++);
            if(charts.bar) charts.bar.destroy();
            charts.bar = new Chart(ctxBar, { type: 'bar', data: { labels: ['J','F','M','A','M','J','J','A','S','O','N','D'], datasets: [{ data: counts, backgroundColor: '#7f1d1d' }] }, options: { plugins: { legend: { display: false } } } });
        }

        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                organisme: document.getElementById('organisme').value,
                nom_evenement: document.getElementById('nom_evenement').value,
                point_contact: document.getElementById('point_contact').value,
                date_evenement: document.getElementById('date_evenement').value,
                heure_orga: document.getElementById('heure_orga').value,
                heure_public: document.getElementById('heure_public').value,
                heure_fin: document.getElementById('heure_fin').value,
                nb_participants: parseInt(document.getElementById('nb_participants').value) || 0,
                nb_chaises: parseInt(document.getElementById('nb_chaises').value) || 0,
                nb_tables: parseInt(document.getElementById('nb_tables').value) || 0,
                micros_hf_regie: parseInt(document.getElementById('micros_hf').value) || 0,
                micros_filaires_scene: parseInt(document.getElementById('micros_filaires').value) || 0,
                options_tech: Array.from(document.querySelectorAll('#tech_opts input:checked')).map(i => i.value),
                cadets_notes: document.getElementById('cadets_notes').value
            };
            const { error } = await _supa.from('demandes_auditorium').insert([payload]);
            if (!error) { alert("Transmis"); location.reload(); }
        };

        window.genererPDF = function(id) {
            const d = currentData.find(i => i.id === id);
            const doc = new jspdf.jsPDF();
            doc.text(`Fiche Technique: ${d.nom_evenement}`, 10, 10);
            doc.autoTable({ startY: 20, body: [['Organisme', d.organisme], ['Date', d.date_evenement], ['Participants', d.nb_participants]] });
            doc.save(`Fiche_${d.nom_evenement}.pdf`);
        };

        async function supprimerLigne(id) {
            if(confirm("Supprimer ?")) { await _supa.from('demandes_auditorium').delete().eq('id', id); charger(); }
        }

        function handleLogout() { _supa.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
