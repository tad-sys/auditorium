<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régie Auditorium - Musée de l'Armée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; overflow-x: hidden; }
        .font-prestige { font-family: 'Cinzel', serif; }
        .gradient-musee { background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%); }
        .card-premium { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-premium:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        
        /* Modals */
        #login-modal, #planning-modal, #details-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 9999; background: rgba(0,0,0,0.85); 
            display: none; align-items: center; justify-content: center; 
            backdrop-filter: blur(10px); 
        }

        .calendar-container { display: grid; grid-template-columns: repeat(7, 1fr); background: #e2e8f0; gap: 1px; border-radius: 1rem; overflow: hidden; border: 1px solid #e2e8f0; }
        .calendar-day-head { background: #f8fafc; padding: 15px; text-align: center; font-weight: 900; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; }
        .calendar-day-cell { background: white; min-height: 140px; padding: 10px; transition: all 0.2s; }
        .calendar-day-num { font-weight: 900; color: #cbd5e1; font-size: 16px; margin-bottom: 8px; display: block; }
        .event-badge { background: #7f1d1d; color: white; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; margin-bottom: 4px; cursor: pointer; border-left: 4px solid #d4af37; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        input:focus, textarea:focus { border-color: #7f1d1d !important; outline: none; box-shadow: 0 0 0 4px rgba(127, 29, 29, 0.1); }
        .radar-check:checked + label { background-color: #d4af37; color: white; border-color: #d4af37; }
    </style>
</head>
<body>

    <nav class="gradient-musee text-white p-6 shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-5">
                <div class="bg-white/10 p-3 rounded-2xl backdrop-blur-md">
                    <i class="fa-solid fa-building-columns text-amber-500 text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-prestige text-xl tracking-[0.2em] uppercase">Auditorium Austerlitz</h1>
                    <p class="text-[9px] uppercase font-black tracking-widest text-amber-500/80">Régie Technique - Musée de l'Armée</p>
                </div>
            </div>
            
            <div class="flex gap-4 items-center">
                <div id="admin-filters" class="hidden flex gap-2">
                    <select id="global-month-filter" onchange="changerFiltres()" class="bg-white/10 text-white border border-white/30 rounded-full px-5 py-2.5 text-xs font-black outline-none cursor-pointer hover:bg-white/20 transition-all">
                        <option value="all" class="text-black">Tous les mois</option>
                        <option value="01" class="text-black">Janvier</option><option value="02" class="text-black">Février</option>
                        <option value="03" class="text-black">Mars</option><option value="04" class="text-black">Avril</option>
                        <option value="05" class="text-black">Mai</option><option value="06" class="text-black">Juin</option>
                        <option value="07" class="text-black">Juillet</option><option value="08" class="text-black">Août</option>
                        <option value="09" class="text-black">Septembre</option><option value="10" class="text-black">Octobre</option>
                        <option value="11" class="text-black">Novembre</option><option value="12" class="text-black">Décembre</option>
                    </select>
                </div>
                <button id="btn-open-planning" onclick="ouvrirPlanning()" class="hidden bg-amber-500 text-red-950 px-6 py-2.5 rounded-full text-[10px] font-black uppercase hover:bg-amber-400 transition-all shadow-lg active:scale-95">Planning</button>
                <button onclick="document.getElementById('login-modal').style.display='flex'" id="btn-login-trigger" class="text-[10px] font-black uppercase border border-white/40 px-6 py-2.5 rounded-full hover:bg-white/20 transition-all cursor-pointer">Accès Régisseur</button>
                <button id="btn-logout" onclick="handleLogout()" class="hidden text-[10px] font-black uppercase bg-white text-red-900 px-6 py-2.5 rounded-full shadow-lg hover:bg-slate-100 transition-all">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div id="vue-client" class="max-w-5xl mx-auto py-12 px-4 space-y-10">
        <form id="main-form" class="space-y-10">
            <div class="card-premium p-10 border-t-[12px] border-red-900 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 p-8 opacity-5 text-8xl text-red-900 font-black italic">01</div>
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-8 border-b pb-4 flex items-center gap-3 italic">
                    <i class="fa-solid fa-address-card text-2xl"></i> Identification & Contact
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Client / Organisme</label>
                        <input type="text" id="organisme" placeholder="Ex: Direction du Musée" required class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Nom de l'événement</label>
                        <input type="text" id="nom_evenement" placeholder="Ex: Colloque Austerlitz" required class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Responsable / Point de contact</label>
                        <input type="text" id="point_contact" placeholder="Nom et Prénom" required class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl transition-all">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Email</label>
                            <input type="email" id="contact_email" placeholder="contact@mail.com" required class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Téléphone</label>
                            <input type="tel" id="contact_tel" placeholder="06..." class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl transition-all">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase text-red-900 ml-2 italic">Date de la manifestation</label>
                        <input type="date" id="date_evenement" required class="w-full p-4 bg-red-50/30 border-2 border-red-100 rounded-2xl font-bold">
                    </div>
                    <div class="grid grid-cols-3 gap-4 bg-slate-900 p-6 rounded-3xl shadow-inner">
                        <div class="flex flex-col">
                            <label class="text-[9px] font-black uppercase text-amber-500 mb-2 text-center italic">Arrivée Orga</label>
                            <input type="time" id="heure_orga" required class="w-full p-3 bg-white/10 border border-white/20 rounded-xl font-black text-center text-white">
                        </div>
                        <div class="flex flex-col">
                            <label class="text-[9px] font-black uppercase text-amber-500 mb-2 text-center italic">Public</label>
                            <input type="time" id="heure_public" required class="w-full p-3 bg-white/10 border border-white/20 rounded-xl font-black text-center text-white">
                        </div>
                        <div class="flex flex-col">
                            <label class="text-[9px] font-black uppercase text-amber-500 mb-2 text-center italic">Fin Presta</label>
                            <input type="time" id="heure_fin" required class="w-full p-3 bg-white/10 border border-white/20 rounded-xl font-black text-center text-white">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-premium p-10 shadow-2xl relative">
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-8 border-b pb-4 italic flex items-center gap-3">
                    <i class="fa-solid fa-users-gear text-2xl"></i> Accueil & Logistique
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                    <div class="space-y-6">
                        <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                            <label class="text-[10px] font-black text-slate-400 uppercase italic mb-4 block">Nombre de participants (max 145)</label>
                            <input type="number" id="nb_participants" placeholder="0" class="w-full p-6 bg-white border-2 border-slate-200 rounded-2xl text-4xl font-black text-red-900 text-center shadow-inner">
                        </div>
                        <label class="flex items-center gap-4 p-5 bg-blue-50/50 rounded-2xl border border-blue-100 cursor-pointer hover:bg-blue-50 transition-all">
                            <input type="checkbox" id="wifi_public" class="w-6 h-6 accent-blue-600">
                            <span class="text-xs font-black uppercase italic text-blue-900">Accès Internet Wifi Public</span>
                        </label>
                    </div>
                    
                    <div id="acc_list" class="space-y-4 bg-slate-50 p-6 rounded-3xl border border-slate-100">
                        <p class="font-black text-[11px] uppercase text-red-900 italic border-b border-red-200 pb-2 mb-4">Espaces d'Accueil</p>
                        <label class="flex items-center gap-4 text-xs font-bold text-slate-600 cursor-pointer p-2 hover:bg-white rounded-lg"><input type="checkbox" value="Hall Orient" class="w-5 h-5 accent-red-900"> Hall Orient</label>
                        <label class="flex items-center gap-4 text-xs font-bold text-slate-600 cursor-pointer p-2 hover:bg-white rounded-lg"><input type="checkbox" value="Auditorium" class="w-5 h-5 accent-red-900"> Auditorium</label>
                        <label class="flex items-center gap-4 text-xs font-bold text-slate-600 cursor-pointer p-2 hover:bg-white rounded-lg"><input type="checkbox" value="Table/Desk" class="w-5 h-5 accent-red-900"> Table / Desk d'accueil</label>
                    </div>

                    <div id="vest_list" class="space-y-4 bg-slate-50 p-6 rounded-3xl border border-slate-100">
                        <p class="font-black text-[11px] uppercase text-red-900 italic border-b border-red-200 pb-2 mb-4">Vestiaires</p>
                        <label class="flex items-center gap-4 text-xs font-bold text-slate-600 cursor-pointer p-2 hover:bg-white rounded-lg"><input type="checkbox" value="SAS Auditorium" class="w-5 h-5 accent-red-900"> SAS Auditorium</label>
                        <label class="flex items-center gap-4 text-xs font-bold text-slate-600 cursor-pointer p-2 hover:bg-white rounded-lg"><input type="checkbox" value="Salle des Cadets" class="w-5 h-5 accent-red-900"> Salle des Cadets</label>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div class="card-premium p-10 border-l-[16px] border-orange-500 shadow-xl">
                    <h3 class="text-orange-700 font-black uppercase text-xs mb-8 flex items-center gap-3 italic"><i class="fa-solid fa-chair text-xl"></i> Mobilier Scène</h3>
                    <div class="grid grid-cols-2 gap-8">
                        <div class="space-y-3">
                            <label class="text-[10px] uppercase font-black text-slate-500 italic ml-2">Chaises (max 6)</label>
                            <input type="number" id="nb_chaises" min="0" max="6" value="0" class="w-full p-5 bg-orange-50/30 border-2 border-orange-100 rounded-2xl font-black text-2xl text-orange-900 text-center">
                        </div>
                        <div class="space-y-3">
                            <label class="text-[10px] uppercase font-black text-slate-500 italic ml-2">Tables (max 3)</label>
                            <input type="number" id="nb_tables" min="0" max="3" value="0" class="w-full p-5 bg-orange-50/30 border-2 border-orange-100 rounded-2xl font-black text-2xl text-orange-900 text-center">
                        </div>
                    </div>
                </div>

                <div class="card-premium p-10 border-l-[16px] border-blue-600 shadow-xl">
                    <h3 class="text-blue-800 font-black uppercase text-xs mb-8 flex items-center gap-3 italic"><i class="fa-solid fa-microphone-lines text-xl"></i> Équipement Régie</h3>
                    <div class="grid grid-cols-2 gap-8 mb-8">
                        <div class="space-y-3">
                            <label class="text-[10px] uppercase font-black text-slate-500 italic ml-2">Micros HF (max 2)</label>
                            <input type="number" id="micros_hf" min="0" max="2" value="0" class="w-full p-5 bg-blue-50/30 border-2 border-blue-100 rounded-2xl font-black text-2xl text-blue-900 text-center">
                        </div>
                        <div class="space-y-3">
                            <label class="text-[10px] uppercase font-black text-slate-500 italic ml-2">Micros Filaires</label>
                            <input type="number" id="micros_filaires" min="0" max="6" value="0" class="w-full p-5 bg-blue-50/30 border-2 border-blue-100 rounded-2xl font-black text-2xl text-blue-900 text-center">
                        </div>
                    </div>
                    <div id="tech_opts" class="flex flex-wrap gap-3">
                        <label class="flex-1 min-w-[120px] flex items-center justify-center gap-2 bg-slate-100 p-3 rounded-xl border border-slate-200 cursor-pointer text-[9px] font-black uppercase hover:bg-blue-600 hover:text-white transition-all"><input type="checkbox" value="Visio" class="hidden">Visio-Conférence</label>
                        <label class="flex-1 min-w-[120px] flex items-center justify-center gap-2 bg-slate-100 p-3 rounded-xl border border-slate-200 cursor-pointer text-[9px] font-black uppercase hover:bg-blue-600 hover:text-white transition-all"><input type="checkbox" value="Captation" class="hidden">Captation Vidéo</label>
                        <label class="flex-1 min-w-[120px] flex items-center justify-center gap-2 bg-slate-100 p-3 rounded-xl border border-slate-200 cursor-pointer text-[9px] font-black uppercase hover:bg-blue-600 hover:text-white transition-all"><input type="checkbox" value="Record" class="hidden">Enregistrement</label>
                    </div>
                </div>
            </div>

            <div class="card-premium p-10 border-l-[16px] border-amber-600 bg-amber-50/20 shadow-xl">
                <h3 class="text-amber-800 font-black uppercase text-sm mb-6 italic flex items-center gap-3"><i class="fa-solid fa-chalkboard-user text-2xl"></i> Salle des Cadets / Divers</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                    <label class="flex items-center gap-6 p-8 bg-white rounded-[2.5rem] border-2 border-amber-100 cursor-pointer shadow-sm group">
                        <input type="checkbox" id="cadets_retrans" class="w-12 h-12 accent-amber-700">
                        <span class="text-xs font-black uppercase text-amber-900 leading-relaxed">Retransmission Auditorium en direct (Vidéo & Audio)</span>
                    </label>
                    <textarea id="cadets_notes" placeholder="Notes complémentaires, besoins spécifiques..." class="w-full p-8 bg-white border-2 border-amber-100 rounded-[2.5rem] h-40 text-sm outline-none shadow-inner"></textarea>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full gradient-musee text-white py-10 rounded-[2.5rem] text-3xl font-black uppercase tracking-[0.5em] shadow-2xl hover:scale-[1.02] active:scale-95 transition-all">Transmettre à la régie</button>
        </form>
    </div>

    <div id="vue-admin" class="hidden max-w-7xl mx-auto py-12 px-4 space-y-12">
        <div id="admin-list" class="grid grid-cols-1 gap-8"></div>
    </div>

    <div id="login-modal">
        <div class="bg-white rounded-[3rem] p-12 max-w-md w-full shadow-2xl border-4 border-red-900 relative">
            <button onclick="document.getElementById('login-modal').style.display='none'" class="absolute top-6 right-6 text-slate-300 hover:text-red-900 transition-all"><i class="fa-solid fa-circle-xmark text-2xl"></i></button>
            <div class="text-center mb-10">
                <h3 class="font-prestige text-2xl text-red-900 mb-2">Espace Régie</h3>
                <div class="h-1 w-20 bg-amber-500 mx-auto rounded-full"></div>
            </div>
            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-4 italic">Identifiant</label>
                    <input type="email" id="adm-email" placeholder="admin@musee.fr" class="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-4 italic">Mot de passe</label>
                    <input type="password" id="adm-pass" placeholder="••••••••" class="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none">
                </div>
                <button type="button" id="btn-auth-submit" class="w-full gradient-musee text-white py-6 rounded-2xl font-black uppercase tracking-widest shadow-xl hover:shadow-red-900/20">Se connecter</button>
            </div>
        </div>
    </div>

    <script>
        const S_URL = 'https://hecyorhhyidlfdluelit.supabase.co'; 
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlY3lvcmhoeWlkbGZkbHVlbGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5OTI3MDAsImV4cCI6MjA4MjU2ODcwMH0.KloEAEbI1hgP1yR4vU2in4QVgg4AkBqrTtisPb2fdes';
        const _supa = supabase.createClient(S_URL, S_KEY);
        let allEvents = [];

        // AUTHENTICATION
        document.getElementById('btn-auth-submit').addEventListener('click', async () => {
            const email = document.getElementById('adm-email').value;
            const password = document.getElementById('adm-pass').value;
            const { error } = await _supa.auth.signInWithPassword({ email, password });
            if (error) {
                alert("Erreur: " + error.message);
            } else {
                document.getElementById('login-modal').style.display = 'none';
                basculerVueAdmin();
            }
        });

        async function basculerVueAdmin() {
            document.getElementById('vue-client').classList.add('hidden');
            document.getElementById('vue-admin').classList.remove('hidden');
            document.getElementById('admin-filters').classList.remove('hidden');
            document.getElementById('btn-open-planning').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
            document.getElementById('btn-login-trigger').classList.add('hidden');
            await chargerDonnees();
        }

        async function chargerDonnees() {
            const { data } = await _supa.from('demandes_auditorium').select('*').order('date_evenement', { ascending: true });
            if (data) {
                allEvents = data;
                appliquerFiltres();
            }
        }

        function appliquerFiltres() {
            const mois = document.getElementById('global-month-filter').value;
            let filtered = allEvents;
            if (mois !== 'all') {
                filtered = allEvents.filter(d => d.date_evenement.split('-')[1] === mois);
            }
            renderList(filtered);
        }

        window.changerFiltres = appliquerFiltres;

        function renderList(data) {
            document.getElementById('admin-list').innerHTML = data.map(d => `
                <div class="card-premium overflow-hidden border-t-8 border-red-900">
                    <div class="p-8 bg-slate-50 flex justify-between items-center border-b border-slate-100">
                        <div class="flex gap-6 items-center">
                            <div class="text-center bg-red-900 text-white p-4 rounded-2xl shadow-lg min-w-[100px]">
                                <span class="block text-[10px] uppercase font-black opacity-60">Session</span>
                                <span class="block text-xl font-black">${d.date_evenement.split('-')[2]}/${d.date_evenement.split('-')[1]}</span>
                                <span class="block text-[10px] font-bold opacity-60 mt-1">${d.heure_orga} - ${d.heure_fin}</span>
                            </div>
                            <div>
                                <h2 class="font-prestige text-2xl text-slate-800">${d.nom_evenement}</h2>
                                <p class="text-xs font-black uppercase text-red-900 italic tracking-widest">${d.organisme}</p>
                            </div>
                        </div>
                        <div class="flex gap-3">
                             <button onclick="genererPDF('${d.id}')" class="bg-slate-900 text-white px-8 py-4 rounded-2xl text-[10px] font-black uppercase shadow-xl hover:bg-red-900 transition-all flex items-center gap-2">
                                <i class="fa-solid fa-file-pdf text-lg"></i> Exporter PDF Fidèle
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // GENERATION PDF HAUTE FIDELITÉ
        window.genererPDF = function(id) {
            const d = allEvents.find(item => item.id === id);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const margin = 15;
            
            // --- PAGE 1 : EXPRESSION DES BESOINS ---
            doc.setFont("helvetica", "bold");
            doc.setFontSize(10);
            doc.text("Musée de l'Armée - Invalides", margin, 15);
            doc.setFontSize(14);
            doc.text("AUDITORIUM AUSTERLITZ", 105, 25, { align: "center" });
            doc.setFontSize(11);
            doc.text("Fiche technique - Expression des besoins", 105, 32, { align: "center" });
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text("RDV technique : Non", margin, 42);
            
            // Bloc Info
            const drawField = (label, value, y) => {
                doc.setFont("helvetica", "bold");
                doc.text(label + " : ", margin, y);
                doc.setFont("helvetica", "normal");
                doc.text(value || "....................................................................", margin + 35, y);
            };

            drawField("Client / Organisme", d.organisme, 52);
            drawField("Manifestation", d.nom_evenement, 59);
            drawField("Date(s)", d.date_evenement, 66);
            drawField("Point de contact", d.point_contact, 73);
            drawField("Courriel", d.contact_email, 80);
            drawField("Téléphone", d.contact_tel, 87);
            
            // Horaires
            doc.setFont("helvetica", "bold");
            doc.text("Heure arrivée organisateur : " + (d.heure_orga || '....'), margin, 97);
            doc.setFontSize(7);
            doc.text("ouverture des portes - min. 30 minutes avant l'arrivée des participants", margin, 100);
            doc.setFontSize(9);
            doc.text("Heure arrivée participants : " + (d.heure_public || '....'), margin, 107);
            doc.text("Départ participants : " + (d.heure_fin || '....'), 110, 107);
            doc.text("Fin de la prestation : " + (d.heure_fin || '....'), margin, 114);
            doc.setFontSize(7);
            doc.text("fermeture des portes - min. 30 minutes après le départ des participants", margin, 117);

            const drawSection = (title, yPos) => {
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.setFillColor(240, 240, 240);
                doc.rect(margin, yPos, 180, 6, 'F');
                doc.text(title, margin + 2, yPos + 4.5);
            };

            let currentY = 125;
            drawSection("SALLE / SCÈNE", currentY);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(8);
            currentY += 10;
            doc.text("X pupitre fixe avec microphone", margin, currentY);
            doc.text(`${d.nb_participants || '...'} PARTICIPANTS (max 145)`, 70, currentY);
            doc.text(`Chaises : ${d.nb_chaises || 0} (max 6)`, 130, currentY);
            currentY += 5;
            doc.text(`Tables : ${d.nb_tables || 0} (max 3)`, 130, currentY);

            currentY += 10;
            drawSection("ACCUEIL", currentY);
            currentY += 10;
            const acc = d.lieux_accueil || [];
            doc.text(`${acc.includes("Hall Orient") ? 'X' : 'O'} Hall Orient`, margin, currentY);
            doc.text(`${acc.includes("Auditorium") ? 'X' : 'O'} Auditorium`, 70, currentY);
            doc.text(`${acc.includes("Table/Desk") ? 'X' : 'O'} Table/Desk`, 130, currentY);

            currentY += 15;
            drawSection("RÉGIE / TECHNIQUE", currentY);
            currentY += 10;
            doc.text(`${d.micros_hf_regie || 0} Micros sans fil HF (max 2)`, margin, currentY);
            doc.text(`${d.options_tech?.includes("Visio") ? 'X' : 'O'} Visio-Conférence`, 70, currentY);
            doc.text(`${d.options_tech?.includes("Captation") ? 'X' : 'O'} Captation Vidéo`, 130, currentY);
            currentY += 5;
            doc.text(`${d.wifi_public ? 'X' : 'O'} Wifi Public`, 130, currentY);

            // Pied de page légal (RGPD)
            doc.setFontSize(6);
            const legalText = "Le musée de l'Armée, responsable du traitement, met en œuvre un traitement de données à caractère personnel ayant pour finalité l'organisation d'un événement... Une fois l'événement terminé, les données sont supprimées. Vous bénéficiez d'un droit d'accès et de rectification via rgpd@musee-armee.fr.";
            doc.text(legalText, margin, 275, { maxWidth: 180 });

            // --- PAGE 2 : MODÈLE DÉROULÉ ---
            doc.addPage();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(10);
            doc.text("Musée de l'Armée - Invalides", margin, 15);
            doc.text("AUDITORIUM AUSTERLITZ - Fiche modèle déroulé", 105, 25, { align: "center" });
            
            doc.text("Evénement : " + d.nom_evenement, margin, 40);
            doc.text("Date : " + d.date_evenement, margin, 47);

            doc.autoTable({
                startY: 55,
                head: [['Heure', 'Durée', 'Séquence', 'Intervenant(s)', 'Projection', 'Commentaires']],
                body: Array(10).fill(['', '', '', '', '', '']),
                theme: 'grid',
                headStyles: { fillColor: [127, 29, 29], fontSize: 8 },
                styles: { fontSize: 7, cellPadding: 4 }
            });

            doc.save(`Fiche_Technique_${d.nom_evenement}.pdf`);
        };

        // SUBMISSION
        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Envoi en cours...';
            btn.disabled = true;

            const payload = {
                organisme: document.getElementById('organisme').value,
                nom_evenement: document.getElementById('nom_evenement').value,
                point_contact: document.getElementById('point_contact').value,
                contact_email: document.getElementById('contact_email').value,
                contact_tel: document.getElementById('contact_tel').value,
                date_evenement: document.getElementById('date_evenement').value,
                heure_orga: document.getElementById('heure_orga').value,
                heure_public: document.getElementById('heure_public').value,
                heure_fin: document.getElementById('heure_fin').value,
                nb_participants: parseInt(document.getElementById('nb_participants').value) || 0,
                wifi_public: document.getElementById('wifi_public').checked,
                lieux_accueil: Array.from(document.querySelectorAll('#acc_list input:checked')).map(i => i.value),
                nb_chaises: parseInt(document.getElementById('nb_chaises').value) || 0,
                nb_tables: parseInt(document.getElementById('nb_tables').value) || 0,
                micros_hf_regie: parseInt(document.getElementById('micros_hf').value) || 0,
                options_tech: Array.from(document.querySelectorAll('#tech_opts input:checked')).map(i => i.value),
                cadets_retransmission: document.getElementById('cadets_retrans').checked,
                cadets_notes: document.getElementById('cadets_notes').value
            };

            const { error } = await _supa.from('demandes_auditorium').insert([payload]);
            if (error) {
                alert("Erreur: " + error.message);
                btn.innerHTML = 'Réessayer';
                btn.disabled = false;
            } else {
                alert("✓ Votre fiche technique a été transmise à la régie.");
                location.reload();
            }
        };

        function handleLogout() { _supa.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
