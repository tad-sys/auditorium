<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régie Auditorium - Musée de l'Armée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; }
        .font-prestige { font-family: 'Cinzel', serif; }
        .gradient-musee { background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
        .input-focus:focus { border-color: #7f1d1d; ring: 2px; ring-color: #7f1d1d; outline: none; }
        .hidden { display: none !important; }
        
        /* Styles Calendrier */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #e2e8f0; border: 1px solid #e2e8f0; }
        .calendar-day { background: white; min-height: 90px; padding: 5px; }
        .calendar-event { background: #7f1d1d; color: white; font-size: 10px; padding: 2px 4px; border-radius: 3px; margin-top: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body class="text-slate-800">

    <nav class="gradient-musee text-white p-6 shadow-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-building-columns text-3xl"></i>
                <h1 class="font-prestige text-xl tracking-widest uppercase">Auditorium Austerlitz</h1>
            </div>
            <div class="flex items-center gap-4">
                <div id="admin-controls" class="hidden flex items-center gap-2">
                    <select id="filter-year" onchange="applyFilters()" class="bg-white/10 border border-white/20 rounded px-2 py-1 text-sm outline-none">
                        <option value="2025">2025</option><option value="2026">2026</option>
                    </select>
                    <select id="filter-month" onchange="applyFilters()" class="bg-white/10 border border-white/20 rounded px-2 py-1 text-sm outline-none">
                        <option value="all">Tous les mois</option>
                        <option value="01">Janvier</option><option value="02">Février</option><option value="03">Mars</option>
                        <option value="04">Avril</option><option value="05">Mai</option><option value="06">Juin</option>
                        <option value="07">Juillet</option><option value="08">Août</option><option value="09">Septembre</option>
                        <option value="10">Octobre</option><option value="11">Novembre</option><option value="12">Décembre</option>
                    </select>
                    <button onclick="openPlanning()" class="bg-amber-500 text-red-950 px-4 py-1 rounded text-xs font-bold uppercase">Planning Régie</button>
                </div>
                <button onclick="toggleAdmin()" id="btn-admin" class="border border-white/30 px-4 py-1 rounded text-xs font-bold hover:bg-white/10">ACCÈS RÉGISSEUR</button>
                <button onclick="handleLogout()" id="btn-logout" class="hidden bg-white text-red-900 px-4 py-1 rounded text-xs font-bold uppercase">Quitter</button>
            </div>
        </div>
    </nav>

    <div id="vue-client" class="max-w-4xl mx-auto py-12 px-6">
        <form id="form-technique" class="space-y-8">
            <div class="bg-white p-8 rounded-3xl card-shadow border-t-8 border-red-900">
                <h2 class="font-prestige text-2xl text-red-900 mb-6 border-b pb-4 italic">Expression des besoins</h2>
                
                <div class="mb-6 p-4 bg-amber-50 border-l-4 border-amber-500 text-amber-800 text-sm italic">
                    <i class="fa-solid fa-circle-info mr-2"></i> Rappel : La capacité maximale de l'auditorium est de <strong>145 places</strong>.
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-black uppercase text-slate-500 mb-2">Client / Organisme</label>
                        <input type="text" id="organisme" required class="w-full border p-3 rounded-xl input-focus">
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase text-slate-500 mb-2">Nom de l'événement</label>
                        <input type="text" id="nom_evenement" required class="w-full border p-3 rounded-xl input-focus">
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase text-slate-500 mb-2">Date de l'événement</label>
                        <input type="date" id="date_evenement" required class="w-full border p-3 rounded-xl font-bold text-red-900">
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Arrivée Orga</label>
                            <input type="time" id="h_orga" required class="w-full border p-2 rounded-lg text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Public</label>
                            <input type="time" id="h_public" required class="w-full border p-2 rounded-lg text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Fin</label>
                            <input type="time" id="h_fin" required class="w-full border p-2 rounded-lg text-xs">
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-3xl card-shadow">
                    <h3 class="font-prestige text-red-900 mb-4 border-b pb-2">Espaces & Mobilier</h3>
                    <div class="space-y-3" id="acc_list">
                        <label class="flex items-center gap-2 text-sm"><input type="checkbox" value="Hall Orient"> Hall Orient</label>
                        <label class="flex items-center gap-2 text-sm"><input type="checkbox" value="Auditorium"> Auditorium</label>
                    </div>
                    <div class="mt-4 grid grid-cols-2 gap-4">
                        <input type="number" id="nb_chaises" placeholder="Chaises scène" class="border p-2 rounded-lg text-sm">
                        <input type="number" id="nb_tables" placeholder="Tables scène" class="border p-2 rounded-lg text-sm">
                    </div>
                </div>
                <div class="bg-white p-6 rounded-3xl card-shadow">
                    <h3 class="font-prestige text-red-900 mb-4 border-b pb-2">Audio & Régie</h3>
                    <div class="space-y-4">
                        <input type="number" id="micros_hf" placeholder="Micros HF (Sennheiser)" class="w-full border p-2 rounded-lg text-sm">
                        <label class="flex items-center gap-2 text-sm text-blue-700 font-bold">
                            <input type="checkbox" id="wifi_public"> Activer Wifi Public
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full gradient-musee text-white p-6 rounded-3xl font-black uppercase tracking-widest text-xl shadow-lg">Transmettre au régisseur</button>
        </form>
    </div>

    <div id="vue-admin" class="hidden max-w-7xl mx-auto py-10 px-6 space-y-10">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-white p-8 rounded-3xl card-shadow">
                <h3 class="font-prestige text-red-900 mb-6 text-center">Intensité Technique</h3>
                <div style="height: 350px;"><canvas id="radarChart"></canvas></div>
            </div>
            <div class="bg-white p-8 rounded-3xl card-shadow flex flex-col items-center justify-center text-center">
                <span class="text-7xl font-black text-red-900" id="total-count">0</span>
                <span class="text-xs font-black uppercase text-slate-400 mt-2">Dossiers techniques</span>
            </div>
        </div>

        <div id="admin-list" class="space-y-4">
            </div>
    </div>

    <div id="modal-planning" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-5xl rounded-3xl overflow-hidden shadow-2xl">
            <div class="gradient-musee p-6 flex justify-between items-center text-white">
                <h3 class="font-prestige text-xl italic">Calendrier Auditorium</h3>
                <button onclick="closePlanning()" class="text-2xl">&times;</button>
            </div>
            <div id="calendar-body" class="p-4 calendar-grid">
                </div>
        </div>
    </div>

    <script>
        // CONFIG SUPABASE
        const S_URL = 'https://hecyorhhyidlfdluelit.supabase.co'; 
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlY3lvcmhoeWlkbGZkbHVlbGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5OTI3MDAsImV4cCI6MjA4MjU2ODcwMH0.KloEAEbI1hgP1yR4vU2in4QVgg4AkBqrTtisPb2fdes';
        const _supa = supabase.createClient(S_URL, S_KEY);

        let allEvents = [];
        let radarInstance = null;

        async function toggleAdmin() {
            const pass = prompt("Accès sécurisé - Mot de passe :");
            if (pass === "ADMIN_MA") {
                document.getElementById('vue-client').classList.add('hidden');
                document.getElementById('vue-admin').classList.remove('hidden');
                document.getElementById('admin-controls').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                document.getElementById('btn-admin').classList.add('hidden');
                await loadData();
            }
        }

        function handleLogout() {
            location.reload();
        }

        async function loadData() {
            const { data, error } = await _supa.from('demandes_auditorium').select('*').order('date_evenement', { ascending: true });
            if (data) {
                allEvents = data;
                applyFilters();
            }
        }

        function applyFilters() {
            const year = document.getElementById('filter-year').value;
            const month = document.getElementById('filter-month').value;

            const filtered = allEvents.filter(d => {
                const isYear = d.date_evenement.startsWith(year);
                const isMonth = (month === 'all') || (d.date_evenement.split('-')[1] === month);
                return isYear && isMonth;
            });

            renderDashboard(filtered);
            updateRadar(filtered);
            renderCalendar(filtered);
        }

        function renderDashboard(data) {
            document.getElementById('total-count').innerText = data.length;
            const list = document.getElementById('admin-list');
            list.innerHTML = data.map(d => `
                <div class="bg-white p-6 rounded-2xl card-shadow border-l-8 border-red-900 flex justify-between items-center">
                    <div>
                        <div class="text-xs font-black text-red-900 mb-1">${d.date_evenement.split('-').reverse().join('/')} | ${d.h_orga} - ${d.h_fin}</div>
                        <h4 class="font-prestige text-lg uppercase">${d.nom_evenement}</h4>
                        <p class="text-xs text-slate-500 font-bold">${d.organisme}</p>
                    </div>
                    <div class="flex gap-2">
                        <a href="mailto:?subject=Dossier Technique : ${d.nom_evenement}" class="bg-blue-100 text-blue-700 p-3 rounded-xl hover:bg-blue-600 hover:text-white transition-all">
                            <i class="fa-solid fa-envelope"></i>
                        </a>
                        <button onclick="generatePDF('${d.id}')" class="bg-red-900 text-white px-4 py-2 rounded-xl text-xs font-bold">PDF</button>
                        <button onclick="deleteDossier('${d.id}')" class="bg-slate-100 text-slate-400 p-3 rounded-xl hover:bg-red-600 hover:text-white transition-all">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateRadar(data) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            const metrics = { audio: 0, mobilier: 0, wifi: 0 };
            data.forEach(d => {
                metrics.audio += (d.micros_hf || 0) / 2;
                metrics.mobilier += (d.nb_chaises || 0) / 6;
                metrics.wifi += d.wifi_public ? 1 : 0;
            });
            const values = Object.values(metrics).map(v => (v / (data.length || 1)) * 100);

            if (radarInstance) radarInstance.destroy();
            radarInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Audio', 'Mobilier', 'Wifi'],
                    datasets: [{ label: 'Indice', data: values, backgroundColor: 'rgba(127, 29, 29, 0.2)', borderColor: '#7f1d1d' }]
                },
                options: { scales: { r: { beginAtZero: true, max: 100 } }, plugins: { legend: { display: false } } }
            });
        }

        // FONCTIONS PLANNING
        function openPlanning() { document.getElementById('modal-planning').style.display = 'flex'; }
        function closePlanning() { document.getElementById('modal-planning').style.display = 'none'; }

        function renderCalendar(data) {
            const body = document.getElementById('calendar-body');
            body.innerHTML = '';
            // Rendu simplifié sur 31 jours pour l'exemple
            for (let i = 1; i <= 31; i++) {
                const dayEvents = data.filter(d => parseInt(d.date_evenement.split('-')[2]) === i);
                body.innerHTML += `
                    <div class="calendar-day border">
                        <span class="text-[10px] text-slate-400">${i}</span>
                        ${dayEvents.map(e => `<div class="calendar-event" onclick="alert('${e.nom_evenement}\\n${e.h_orga} - ${e.h_fin}')">${e.nom_evenement}</div>`).join('')}
                    </div>
                `;
            }
        }

        // SOUMISSION FORMULAIRE
        document.getElementById('form-technique').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                organisme: document.getElementById('organisme').value,
                nom_evenement: document.getElementById('nom_evenement').value,
                date_evenement: document.getElementById('date_evenement').value,
                h_orga: document.getElementById('h_orga').value,
                h_public: document.getElementById('h_public').value,
                h_fin: document.getElementById('h_fin').value,
                nb_chaises: parseInt(document.getElementById('nb_chaises').value) || 0,
                micros_hf: parseInt(document.getElementById('micros_hf').value) || 0,
                wifi_public: document.getElementById('wifi_public').checked
            };

            const { error } = await _supa.from('demandes_auditorium').insert([payload]);
            if (!error) {
                alert("✓ Demande transmise avec succès !");
                location.reload();
            }
        };

        async function deleteDossier(id) {
            if(confirm("Supprimer ce dossier ?")) {
                await _supa.from('demandes_auditorium').delete().eq('id', id);
                loadData();
            }
        }
    </script>
</body>
</html>
