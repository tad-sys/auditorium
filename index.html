<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régie Auditorium - Calendrier & Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .font-prestige { font-family: 'Cinzel', serif; }
        .gradient-musee { background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%); }
        
        /* Style Calendrier Outlook */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid #e2e8f0; background: white; }
        .calendar-day { min-height: 120px; border: 0.5px solid #f1f5f9; padding: 8px; transition: all 0.2s; }
        .calendar-day:hover { background-color: #f8fafc; }
        .calendar-day.other-month { background-color: #f1f5f9; color: #cbd5e1; }
        .event-tag { 
            background: #7f1d1d; color: white; padding: 2px 6px; border-radius: 4px; 
            font-size: 10px; margin-bottom: 2px; cursor: pointer; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; display: block;
        }
        .event-tag:hover { background: #d4af37; }
        
        #planning-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 10000; background: rgba(0,0,0,0.8); 
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav class="gradient-musee text-white p-4 shadow-xl sticky top-0 z-[1001]">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-calendar-check text-amber-500 text-2xl"></i>
                <h1 class="font-prestige text-lg tracking-widest uppercase">Gestion Auditorium</h1>
            </div>
            <div class="flex gap-3">
                <button id="btn-planning" onclick="togglePlanning()" class="hidden bg-amber-500 text-white px-5 py-2 rounded-full text-[10px] font-black uppercase hover:bg-amber-600 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days"></i> Calendrier Outlook
                </button>
                <button id="btn-login-trigger" onclick="document.getElementById('login-modal').style.display='flex'" class="border border-white/30 px-6 py-2 rounded-full text-[10px] font-black uppercase hover:bg-white/10">Accès Régisseur</button>
                <button id="btn-logout" onclick="handleLogout()" class="hidden bg-white text-red-900 px-6 py-2 rounded-full text-[10px] font-black uppercase">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div id="planning-modal">
        <div class="bg-white rounded-3xl w-[95%] h-[90vh] flex flex-col shadow-2xl overflow-hidden border-4 border-red-900">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <div class="flex items-center gap-6">
                    <h2 id="calendar-title" class="font-prestige text-2xl text-red-900 italic">Janvier 2026</h2>
                    <div class="flex bg-white rounded-lg border shadow-sm">
                        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 border-r"><i class="fa-solid fa-chevron-left"></i></button>
                        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="flex gap-2">
                    <select id="view-filter" onchange="renderCalendar()" class="bg-white border rounded-lg px-4 py-2 text-xs font-bold uppercase">
                        <option value="mois">Mensuel</option>
                        <option value="hebdo">Hebdomadaire</option>
                        <option value="trimestre">Trimestriel</option>
                        <option value="an">Annuel</option>
                    </select>
                    <button onclick="togglePlanning()" class="text-slate-400 hover:text-red-900 text-2xl"><i class="fa-solid fa-circle-xmark"></i></button>
                </div>
            </div>
            <div id="calendar-container" class="flex-1 overflow-y-auto p-4 bg-slate-100">
                <div class="calendar-grid text-[10px] font-black uppercase text-slate-400 mb-1 text-center bg-transparent border-none">
                    <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
                </div>
                <div id="calendar-body" class="calendar-grid">
                    </div>
            </div>
        </div>
    </div>

    <div id="vue-admin" class="hidden max-w-7xl mx-auto py-10 px-4 space-y-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-white p-8 rounded-3xl border-t-8 border-red-900 shadow-xl">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-prestige text-red-900 text-lg uppercase italic">Statistiques d'Activité</h3>
                    <div class="flex gap-2">
                        <button onclick="updateStatsFilter('2026')" class="text-[9px] font-black border px-3 py-1 rounded-full hover:bg-red-900 hover:text-white">2026</button>
                        <button onclick="updateStatsFilter('2025')" class="text-[9px] font-black border px-3 py-1 rounded-full hover:bg-red-900 hover:text-white">2025</button>
                    </div>
                </div>
                <canvas id="chartMonths" height="100"></canvas>
            </div>
            <div class="bg-white p-8 rounded-3xl border-t-8 border-amber-500 shadow-xl">
                <h3 class="font-prestige text-red-900 text-sm uppercase mb-4 italic text-center">Profil Technique Moyen</h3>
                <canvas id="chartRadar"></canvas>
            </div>
        </div>

        <div id="admin-list" class="space-y-6"></div>
    </div>

    <div id="login-modal" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:20000; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; backdrop-filter:blur(10px);">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full border-4 border-red-900">
            <h3 class="font-prestige text-xl text-center mb-6 text-red-900 border-b pb-4 italic">Identification Régie</h3>
            <input type="email" id="adm-email" placeholder="Email" class="w-full p-4 bg-slate-50 border rounded-2xl mb-4 outline-none">
            <input type="password" id="adm-pass" placeholder="Mot de passe" class="w-full p-4 bg-slate-50 border rounded-2xl mb-6 outline-none">
            <button id="btn-auth-submit" class="w-full gradient-musee text-white py-4 rounded-2xl font-black uppercase">Se connecter</button>
        </div>
    </div>

    <script>
        // Configuration Supabase
        const S_URL = 'https://hecyorhhyidlfdluelit.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlY3lvcmhoeWlkbGZkbHVlbGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5OTI3MDAsImV4cCI6MjA4MjU2ODcwMH0.KloEAEbI1hgP1yR4vU2in4QVgg4AkBqrTtisPb2fdes';
        const _supa = supabase.createClient(S_URL, S_KEY);

        let currentData = [];
        let currentDate = new Date();
        let charts = {};

        // --- AUTHENTIFICATION ---
        document.getElementById('btn-auth-submit').addEventListener('click', async () => {
            const email = document.getElementById('adm-email').value;
            const password = document.getElementById('adm-pass').value;
            const { error } = await _supa.auth.signInWithPassword({ email, password });
            if (error) alert("Erreur d'accès");
            else {
                document.getElementById('login-modal').style.display = 'none';
                initAdminView();
            }
        });

        async function initAdminView() {
            document.getElementById('vue-admin').classList.remove('hidden');
            document.getElementById('btn-planning').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
            document.getElementById('btn-login-trigger').classList.add('hidden');
            await chargerDonnees();
        }

        async function chargerDonnees() {
            const { data } = await _supa.from('demandes_auditorium').select('*').order('date_evenement', { ascending: true });
            currentData = data || [];
            renderAdminList(currentData);
            initCharts(currentData);
        }

        // --- CALENDRIER STYLE OUTLOOK ---
        function togglePlanning() {
            const modal = document.getElementById('planning-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
            if(modal.style.display === 'flex') renderCalendar();
        }

        function changeMonth(dir) {
            currentDate.setMonth(currentDate.getMonth() + dir);
            renderCalendar();
        }

        function renderCalendar() {
            const body = document.getElementById('calendar-body');
            const title = document.getElementById('calendar-title');
            const view = document.getElementById('view-filter').value;
            
            body.innerHTML = '';
            title.innerText = currentDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }).toUpperCase();

            // Logique de génération des jours (simplifiée pour Mensuel)
            const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
            
            // Padding pour le début de semaine (Lundi)
            let startPadding = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

            for(let i=0; i < startPadding; i++) {
                body.innerHTML += `<div class="calendar-day other-month"></div>`;
            }

            for(let d=1; d <= lastDay.getDate(); d++) {
                const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const events = currentData.filter(e => e.date_evenement === dateStr);
                
                let eventsHtml = events.map(e => `
                    <div onclick="voirDetailDirect('${e.id}')" class="event-tag">
                        ${e.heure_orga} - ${e.nom_evenement}
                    </div>
                `).join('');

                body.innerHTML += `
                    <div class="calendar-day border">
                        <span class="text-xs font-bold ${events.length > 0 ? 'text-red-900 underline' : 'text-slate-400'}">${d}</span>
                        <div class="mt-2">${eventsHtml}</div>
                    </div>
                `;
            }
        }

        function voirDetailDirect(id) {
            togglePlanning();
            const el = document.getElementById(`fiche-${id}`);
            if(el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('ring-4', 'ring-amber-400');
                setTimeout(() => el.classList.remove('ring-4', 'ring-amber-400'), 3000);
            }
        }

        // --- DASHBOARD & LISTE ---
        function renderAdminList(data) {
            const container = document.getElementById('admin-list');
            container.innerHTML = data.map(d => `
                <div id="fiche-${d.id}" class="bg-white rounded-3xl overflow-hidden shadow-lg border-l-8 border-red-900 transition-all">
                    <div class="p-4 bg-slate-50 flex justify-between items-center border-b">
                        <div class="flex items-center gap-4">
                            <span class="bg-red-900 text-white px-3 py-1 rounded-full text-[10px] font-black">${d.date_evenement}</span>
                            <h4 class="font-prestige text-slate-800">${d.nom_evenement}</h4>
                        </div>
                        <div class="flex gap-2">
                             <button onclick="genererPDF('${d.id}')" class="text-[9px] font-black uppercase bg-slate-200 px-4 py-2 rounded-lg hover:bg-slate-300">PDF</button>
                             <button onclick="supprimerLigne('${d.id}')" class="text-red-600 p-2"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6 text-[11px]">
                        <div class="space-y-1">
                            <p class="font-black text-red-900">ORGANISATION</p>
                            <p>Client: <b>${d.organisme}</b></p>
                            <p>Contact: <b>${d.point_contact}</b></p>
                            <p>Pax: <b>${d.nb_participants}</b></p>
                        </div>
                        <div class="space-y-1">
                            <p class="font-black text-amber-600">TECHNIQUE</p>
                            <p>Micros: <b>${d.micros_hf_regie} HF / ${d.micros_filaires_scene} Fil</b></p>
                            <p>Options: <b>${d.options_tech?.join(', ') || 'Aucune'}</b></p>
                        </div>
                        <div class="space-y-1">
                            <p class="font-black text-blue-600">HORAIRES</p>
                            <p>Arrivée: <b>${d.heure_orga}</b> | Public: <b>${d.heure_public}</b></p>
                            <p>Fin: <b>${d.heure_fin}</b></p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function initCharts(data) {
            const ctxBar = document.getElementById('chartMonths').getContext('2d');
            const monthsData = Array(12).fill(0);
            data.forEach(d => { if(d.date_evenement) monthsData[new Date(d.date_evenement).getMonth()]++; });

            if(charts.bar) charts.bar.destroy();
            charts.bar = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'],
                    datasets: [{ label: 'Événements', data: monthsData, backgroundColor: '#7f1d1d', borderRadius: 8 }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            const ctxRadar = document.getElementById('chartRadar').getContext('2d');
            if(charts.radar) charts.radar.destroy();
            charts.radar = new Chart(ctxRadar, {
                type: 'radar',
                data: {
                    labels: ['HF', 'Fil', 'Pax', 'Captation', 'Visio'],
                    datasets: [{
                        data: [7, 5, 8, 4, 6], // Exemple de moyennes calculées
                        backgroundColor: 'rgba(212, 175, 55, 0.2)',
                        borderColor: '#d4af37',
                        borderWidth: 2
                    }]
                },
                options: { scales: { r: { ticks: { display: false }, min: 0, max: 10 } }, plugins: { legend: { display: false } } }
            });
        }

        function handleLogout() { _supa.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
