<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régie Auditorium - Musée de l'Armée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; }
        .font-prestige { font-family: 'Cinzel', serif; }
        .gradient-musee { background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%); }
        .card-premium { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .radar-check:checked + label { background-color: #d4af37; color: white; border-color: #d4af37; }
        
        /* Modal Planning */
        #planning-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100000; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: white; border: 1px solid #e2e8f0; }
        .calendar-day { min-height: 120px; border: 0.5px solid #f1f5f9; padding: 5px; position: relative; }
        .event-item { background: #7f1d1d; color: white; font-size: 9px; padding: 2px 5px; border-radius: 4px; margin-top: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 900; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav class="gradient-musee text-white p-5 shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-building-columns text-amber-500 text-2xl"></i>
                <h1 class="font-prestige text-xl tracking-widest uppercase">Auditorium Austerlitz</h1>
            </div>
            <div class="flex gap-3">
                <button id="btn-open-planning" onclick="ouvrirPlanning()" class="hidden bg-amber-500 text-white px-6 py-2 rounded-full text-[10px] font-black uppercase shadow-lg hover:bg-amber-600 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days"></i> Planning Outlook
                </button>
                <button onclick="document.getElementById('login-modal').style.display='flex'" id="btn-login-trigger" class="text-[10px] font-black uppercase border border-white/40 px-6 py-2 rounded-full hover:bg-white/20 transition-all cursor-pointer">Accès Régisseur</button>
                <button id="btn-logout" onclick="handleLogout()" class="hidden text-[10px] font-black uppercase bg-white text-red-900 px-6 py-2 rounded-full shadow-lg hover:bg-slate-100 transition-all">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div id="planning-modal">
        <div class="bg-white rounded-3xl w-[95%] h-[90vh] flex flex-col shadow-2xl overflow-hidden border-4 border-red-900">
            <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <h3 id="cal-title" class="font-prestige text-xl text-red-900 italic">Janvier 2026</h3>
                    <div class="flex bg-white border rounded-lg overflow-hidden shadow-sm">
                        <button onclick="navCal(-1)" class="px-4 py-2 hover:bg-slate-100 border-r"><i class="fa-solid fa-chevron-left"></i></button>
                        <button onclick="navCal(1)" class="px-4 py-2 hover:bg-slate-100"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="flex gap-2">
                    <select id="cal-filter" onchange="renderOutlook()" class="text-[10px] font-black uppercase border px-4 py-2 rounded-xl bg-white shadow-sm outline-none">
                        <option value="hebdo">Hebdomadaire</option>
                        <option value="mois" selected>Mensuel</option>
                        <option value="trimestre">Trimestriel</option>
                        <option value="an">Annuel</option>
                    </select>
                    <button onclick="document.getElementById('planning-modal').style.display='none'" class="text-slate-400 hover:text-red-900 text-2xl transition-colors"><i class="fa-solid fa-circle-xmark"></i></button>
                </div>
            </div>
            <div id="calendar-view" class="flex-1 overflow-y-auto p-4 bg-slate-100"></div>
        </div>
    </div>

    <div id="vue-client" class="max-w-5xl mx-auto py-12 px-4 space-y-8">
        <form id="main-form" class="space-y-8">
            <div class="card-premium p-8 border-t-8 border-red-900 shadow-2xl">
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-6 border-b pb-2 flex items-center gap-3 italic"><i class="fa-solid fa-address-card text-xl"></i> Identification & Contact</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="text" id="organisme" placeholder="Organisme / Client" required class="w-full p-4 bg-slate-50 border rounded-2xl outline-none shadow-inner transition-all focus:border-red-900">
                    <input type="text" id="nom_evenement" placeholder="Nom de l'événement" required class="w-full p-4 bg-slate-50 border rounded-2xl outline-none shadow-inner transition-all focus:border-red-900">
                    <input type="text" id="point_contact" placeholder="Responsable de l'événement" required class="w-full p-4 bg-slate-50 border rounded-2xl shadow-inner">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="email" id="contact_email" placeholder="Email contact" required class="w-full p-4 bg-slate-50 border rounded-2xl shadow-inner">
                        <input type="tel" id="contact_tel" placeholder="Téléphone" class="w-full p-4 bg-slate-50 border rounded-2xl shadow-inner">
                    </div>
                    <div>
                        <label class="text-[11px] font-black uppercase text-slate-500 ml-2 italic">Date de l'événement</label>
                        <input type="date" id="date_evenement" required class="w-full p-4 bg-slate-50 border rounded-2xl shadow-md border-red-100">
                    </div>
                    <div class="grid grid-cols-3 gap-4 bg-red-50/50 p-4 rounded-2xl border-2 border-red-100">
                        <div class="flex flex-col"><label class="text-[10px] font-black uppercase text-red-900 mb-1 text-center italic">Arrivée Orga</label><input type="time" id="heure_orga" required class="w-full p-2 bg-white border rounded-xl font-bold text-center"></div>
                        <div class="flex flex-col"><label class="text-[10px] font-black uppercase text-red-900 mb-1 text-center italic">Public</label><input type="time" id="heure_public" required class="w-full p-2 bg-white border rounded-xl font-bold text-center"></div>
                        <div class="flex flex-col"><label class="text-[10px] font-black uppercase text-red-900 mb-1 text-center italic">Fin</label><input type="time" id="heure_fin" required class="w-full p-2 bg-white border rounded-xl font-bold text-center"></div>
                    </div>
                </div>
            </div>

            <div class="card-premium p-8 shadow-xl">
                <h3 class="text-[#7f1d1d] font-black uppercase text-sm mb-6 border-b pb-2 flex items-center gap-3 italic"><i class="fa-solid fa-users-gear text-xl"></i> Accueil & Logistique</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase italic mb-2 block">Participants prévus</label>
                        <input type="number" id="nb_participants" placeholder="0" class="w-full p-6 bg-slate-50 border-2 border-slate-100 rounded-3xl text-4xl font-black text-red-900 outline-none text-center shadow-inner">
                        <label class="flex items-center gap-3 mt-6 cursor-pointer bg-slate-100 p-3 rounded-xl hover:bg-slate-200">
                            <input type="checkbox" id="wifi_public" class="w-6 h-6 accent-red-900"> 
                            <span class="text-xs font-black uppercase italic text-slate-700">Accès Wifi Public</span>
                        </label>
                    </div>
                    <div id="acc_list" class="space-y-3 bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-inner">
                        <p class="font-black text-[11px] uppercase text-red-900 italic border-b pb-1">Espaces d'Accueil</p>
                        <label class="flex gap-3 text-xs font-bold text-slate-600 hover:text-red-900 cursor-pointer"><input type="checkbox" value="Hall Orient"> Hall Orient</label>
                        <label class="flex gap-3 text-xs font-bold text-slate-600 hover:text-red-900 cursor-pointer"><input type="checkbox" value="Auditorium"> Auditorium</label>
                        <label class="flex gap-3 text-xs font-bold text-slate-600 hover:text-red-900 cursor-pointer"><input type="checkbox" value="Table/Desk"> Table / Desk</label>
                    </div>
                    <div id="vest_list" class="space-y-3 bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-inner">
                        <p class="font-black text-[11px] uppercase text-red-900 italic border-b pb-1">Vestiaires</p>
                        <label class="flex gap-3 text-xs font-bold text-slate-600 hover:text-red-900 cursor-pointer"><input type="checkbox" value="SAS Auditorium"> SAS Auditorium</label>
                        <label class="flex gap-3 text-xs font-bold text-slate-600 hover:text-red-900 cursor-pointer"><input type="checkbox" value="Salle des Cadets"> Salle des Cadets</label>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="card-premium p-8 border-l-[12px] border-orange-500 shadow-xl">
                    <h3 class="text-orange-700 font-black uppercase text-xs mb-6 flex items-center gap-2 italic"><i class="fa-solid fa-chair"></i> Mobilier Scène</h3>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="text-[10px] uppercase font-black text-slate-500 italic mb-1 block">Chaises (max 6)</label>
                            <input type="number" id="nb_chaises" min="0" max="6" value="0" class="w-full p-4 border-2 border-orange-50 rounded-2xl font-black text-xl text-orange-900">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase font-black text-slate-500 italic mb-1 block">Tables (max 3)</label>
                            <input type="number" id="nb_tables" min="0" max="3" value="0" class="w-full p-4 border-2 border-orange-50 rounded-2xl font-black text-xl text-orange-900">
                        </div>
                    </div>
                </div>
                <div class="card-premium p-8 border-l-[12px] border-blue-600 shadow-xl">
                    <h3 class="text-blue-800 font-black uppercase text-xs mb-6 flex items-center gap-2 italic"><i class="fa-solid fa-microphone-lines"></i> Moyens Techniques</h3>
                    <div class="grid grid-cols-2 gap-6 mb-6">
                        <div><label class="text-[10px] uppercase font-black text-slate-500 italic mb-1 block underline">Micros HF</label><input type="number" id="micros_hf" min="0" max="2" value="0" class="w-full p-4 border-2 border-blue-50 rounded-2xl font-black text-xl text-blue-900"></div>
                        <div><label class="text-[10px] uppercase font-black text-slate-500 italic mb-1 block underline">Micros Fil</label><input type="number" id="micros_filaires" min="0" max="6" value="0" class="w-full p-4 border-2 border-blue-50 rounded-2xl font-black text-xl text-blue-900"></div>
                    </div>
                    <div id="tech_opts" class="flex flex-wrap gap-4 text-[10px] font-black uppercase text-slate-600 italic">
                        <label class="flex gap-2 items-center bg-blue-50 p-2 rounded-lg border border-blue-100 cursor-pointer"><input type="checkbox" value="Visio"> Visio-Conférence</label>
                        <label class="flex gap-2 items-center bg-blue-50 p-2 rounded-lg border border-blue-100 cursor-pointer"><input type="checkbox" value="Captation"> Captation Vidéo</label>
                        <label class="flex gap-2 items-center bg-blue-50 p-2 rounded-lg border border-blue-100 cursor-pointer"><input type="checkbox" value="Record"> Enregistrement</label>
                    </div>
                </div>
            </div>

            <div class="card-premium p-8 border-l-[12px] border-amber-600 bg-amber-50/20 shadow-xl">
                <h3 class="text-amber-800 font-black uppercase text-sm mb-4 italic flex items-center gap-3"><i class="fa-solid fa-chalkboard-user"></i> Salle des Cadets</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <label class="flex items-center gap-5 p-6 bg-white rounded-3xl border-2 border-amber-100 cursor-pointer shadow-sm">
                        <input type="checkbox" id="cadets_retrans" class="w-10 h-10 accent-amber-700">
                        <span class="text-xs font-black uppercase text-amber-900 leading-tight">Retransmission Auditorium en direct</span>
                    </label>
                    <textarea id="cadets_notes" placeholder="Besoins spécifiques Salle des Cadets..." class="w-full p-6 bg-white border-2 border-amber-100 rounded-3xl h-32 text-sm outline-none font-medium"></textarea>
                </div>
            </div>
            <button type="submit" class="w-full gradient-musee text-white py-8 rounded-full text-2xl font-black uppercase tracking-[0.4em] shadow-2xl hover:scale-[1.02] transition-all">Envoyer la fiche technique</button>
        </form>
    </div>

    <div id="vue-admin" class="hidden max-w-7xl mx-auto py-12 px-4 space-y-12">
        
        <div class="card-premium p-6 bg-slate-900 text-white flex flex-wrap justify-between items-center gap-4 shadow-2xl">
            <div class="flex items-center gap-6">
                <h2 class="font-prestige text-amber-500 tracking-tighter uppercase italic text-lg">Tableau de Bord Global</h2>
                <div class="h-8 w-[1px] bg-white/20"></div>
                <div class="flex items-center gap-2">
                    <span class="text-[9px] font-black uppercase text-slate-400 italic">Année:</span>
                    <select id="filter-year" onchange="applyGlobalFilter()" class="bg-slate-800 border-none rounded-lg px-4 py-2 text-xs font-black text-amber-500 outline-none">
                        <option value="2026" selected>2026</option>
                        <option value="2025">2025</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[9px] font-black uppercase text-slate-400 italic">Mois:</span>
                    <select id="filter-month" onchange="applyGlobalFilter()" class="bg-slate-800 border-none rounded-lg px-4 py-2 text-xs font-black text-amber-500 outline-none">
                        <option value="all">Tous les mois</option>
                        <option value="0">Janvier</option><option value="1">Février</option><option value="2">Mars</option><option value="3">Avril</option><option value="4">Mai</option><option value="5">Juin</option><option value="6">Juillet</option><option value="7">Août</option><option value="8">Septembre</option><option value="9">Octobre</option><option value="10">Novembre</option><option value="11">Décembre</option>
                    </select>
                </div>
            </div>
            <p id="stats-summary" class="text-[10px] font-black uppercase bg-amber-500/10 text-amber-500 px-4 py-2 rounded-full border border-amber-500/20 italic">0 Événements trouvés</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 card-premium p-8 bg-white border-t-4 border-red-900 shadow-xl">
                <h3 class="font-prestige text-red-900 text-lg uppercase mb-6 italic underline decoration-amber-500 underline-offset-4">Activité Mensuelle</h3>
                <canvas id="chartMonths" height="120"></canvas>
            </div>

            <div class="card-premium p-8 bg-white border-t-4 border-red-900 shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-prestige text-red-900 text-sm uppercase italic">Radar des Besoins</h3>
                    <i class="fa-solid fa-compass text-amber-500 text-2xl"></i>
                </div>
                <div id="radar-controls" class="flex flex-wrap gap-1 mb-4 border-b pb-4 border-slate-100">
                    <div class="radar-opt"><input type="checkbox" checked id="ax-aff" class="hidden radar-check" value="Affluence" onchange="updateRadar()"><label for="ax-aff" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Affluence</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-hf" class="hidden radar-check" value="Micros HF" onchange="updateRadar()"><label for="ax-hf" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">HF</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-fil" class="hidden radar-check" value="Micros Fil" onchange="updateRadar()"><label for="ax-fil" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Fil</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-capt" class="hidden radar-check" value="Captation" onchange="updateRadar()"><label for="ax-capt" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Captation</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-visio" class="hidden radar-check" value="Visio" onchange="updateRadar()"><label for="ax-visio" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Visio</label></div>
                    <div class="radar-opt"><input type="checkbox" checked id="ax-mobi" class="hidden radar-check" value="Mobilier" onchange="updateRadar()"><label for="ax-mobi" class="text-[8px] font-black uppercase px-2 py-1 border rounded-full cursor-pointer transition-all">Mobilier</label></div>
                </div>
                <canvas id="chartRadar"></canvas>
            </div>
        </div>

        <div id="admin-list" class="grid grid-cols-1 gap-10"></div>
    </div>

    <div id="login-modal" style="display:none;" class="fixed inset-0 bg-black/80 z-[200000] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full border-4 border-red-900 shadow-2xl">
            <h3 class="font-prestige text-xl text-center mb-6 text-red-900 italic">Identification</h3>
            <input type="email" id="adm-email" placeholder="Email" class="w-full p-4 bg-slate-50 border rounded-2xl mb-4 outline-none">
            <input type="password" id="adm-pass" placeholder="Mot de passe" class="w-full p-4 bg-slate-50 border rounded-2xl mb-6 outline-none">
            <button id="btn-auth-submit" class="w-full gradient-musee text-white py-4 rounded-2xl font-black uppercase">Connexion</button>
            <button onclick="document.getElementById('login-modal').style.display='none'" class="w-full text-slate-400 text-[10px] font-black uppercase mt-4">Fermer</button>
        </div>
    </div>

    <script>
        const S_URL = 'https://hecyorhhyidlfdluelit.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlY3lvcmhoeWlkbGZkbHVlbGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5OTI3MDAsImV4cCI6MjA4MjU2ODcwMH0.KloEAEbI1hgP1yR4vU2in4QVgg4AkBqrTtisPb2fdes';
        const _supa = supabase.createClient(S_URL, S_KEY);
        let charts = {}, allData = [], filteredData = [], viewDate = new Date();

        // AUTH
        document.getElementById('btn-auth-submit').onclick = async () => {
            const { error } = await _supa.auth.signInWithPassword({ 
                email: document.getElementById('adm-email').value, 
                password: document.getElementById('adm-pass').value 
            });
            if (!error) { 
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('vue-client').classList.add('hidden');
                document.getElementById('vue-admin').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                document.getElementById('btn-open-planning').classList.remove('hidden');
                chargerDonnees();
            }
        };

        async function chargerDonnees() {
            const { data } = await _supa.from('demandes_auditorium').select('*').order('date_evenement');
            allData = data || [];
            applyGlobalFilter();
        }

        // --- FILTRE GLOBAL : AFFECTE TOUTE LA PAGE ---
        function applyGlobalFilter() {
            const targetYear = parseInt(document.getElementById('filter-year').value);
            const targetMonth = document.getElementById('filter-month').value;

            filteredData = allData.filter(d => {
                const dDate = new Date(d.date_evenement);
                const matchYear = dDate.getFullYear() === targetYear;
                const matchMonth = targetMonth === "all" ? true : dDate.getMonth() === parseInt(targetMonth);
                return matchYear && matchMonth;
            });

            document.getElementById('stats-summary').innerText = `${filteredData.length} Événements trouvés`;
            
            // On met à jour tous les composants avec les données filtrées
            renderList(filteredData);
            initCharts(filteredData);
        }

        // --- PLANNING (Reste indépendant pour navigation libre) ---
        function ouvrirPlanning() { document.getElementById('planning-modal').style.display = 'flex'; renderOutlook(); }
        function navCal(dir) {
            const type = document.getElementById('cal-filter').value;
            if(type === 'mois') viewDate.setMonth(viewDate.getMonth() + dir);
            else if(type === 'hebdo') viewDate.setDate(viewDate.getDate() + (dir * 7));
            else if(type === 'an') viewDate.setFullYear(viewDate.getFullYear() + dir);
            renderOutlook();
        }

        function renderOutlook() {
            const container = document.getElementById('calendar-view');
            container.innerHTML = '';
            document.getElementById('cal-title').innerText = viewDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }).toUpperCase();
            const grid = document.createElement('div');
            grid.className = "calendar-grid";
            const lastDay = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
            for(let i=1; i<=lastDay; i++) {
                const dateStr = `${viewDate.getFullYear()}-${String(viewDate.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const events = allData.filter(e => e.date_evenement === dateStr);
                const dayEl = document.createElement('div');
                dayEl.className = "calendar-day bg-white";
                dayEl.innerHTML = `<span class="text-[10px] font-black text-slate-300 italic">${i}</span>`;
                events.forEach(ev => {
                    const evEl = document.createElement('div');
                    evEl.className = "event-item";
                    evEl.innerText = ev.nom_evenement;
                    evEl.onclick = () => {
                        document.getElementById('planning-modal').style.display = 'none';
                        const el = document.getElementById(`fiche-${ev.id}`);
                        if(el) {
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            el.classList.add('ring-8', 'ring-amber-500');
                            setTimeout(() => el.classList.remove('ring-8', 'ring-amber-500'), 2000);
                        } else {
                            alert("Cet événement n'est pas dans le filtre actuel de la page.");
                        }
                    };
                    dayEl.appendChild(evEl);
                });
                grid.appendChild(dayEl);
            }
            container.appendChild(grid);
        }

        // --- GRAPHIQUES ---
        function initCharts(data) {
            const ctxBar = document.getElementById('chartMonths').getContext('2d');
            const months = Array(12).fill(0);
            data.forEach(d => { months[new Date(d.date_evenement).getMonth()]++; });
            
            if(charts.bar) charts.bar.destroy();
            charts.bar = new Chart(ctxBar, { 
                type: 'bar', 
                data: { 
                    labels: ['Jan','Fév','Mar','Avr','Mai','Jui','Jui','Aoû','Sep','Oct','Nov','Déc'], 
                    datasets: [{ data: months, backgroundColor: '#7f1d1d', borderRadius: 10 }] 
                },
                options: { plugins: { legend: { display: false } } }
            });
            updateRadar();
        }

        function updateRadar() {
            const ctxRadar = document.getElementById('chartRadar').getContext('2d');
            const total = filteredData.length || 1;
            const fullMetrics = {
                'Affluence': (filteredData.reduce((a, b) => a + (b.nb_participants || 0), 0) / total) / 20,
                'Micros HF': (filteredData.reduce((a, b) => a + (b.micros_hf_regie || 0), 0) / total) * 5,
                'Micros Fil': (filteredData.reduce((a, b) => a + (b.micros_filaires_scene || 0), 0) / total) * 1.6,
                'Captation': (filteredData.filter(d => d.options_tech?.includes('Captation')).length / total) * 10,
                'Visio': (filteredData.filter(d => d.options_tech?.includes('Visio')).length / total) * 10,
                'Mobilier': (filteredData.reduce((a, b) => a + (b.nb_chaises || 0) + (b.nb_tables || 0), 0) / total)
            };
            const selectedLabels = Array.from(document.querySelectorAll('.radar-check:checked')).map(i => i.value);
            if(charts.radar) charts.radar.destroy();
            charts.radar = new Chart(ctxRadar, { 
                type: 'radar', 
                data: { 
                    labels: selectedLabels, 
                    datasets: [{ data: selectedLabels.map(l => fullMetrics[l] || 0), backgroundColor: 'rgba(212, 175, 55, 0.4)', borderColor: '#d4af37', borderWidth: 4 }] 
                },
                options: { scales: { r: { min: 0, max: 10, ticks: { display: false } } }, plugins: { legend: { display: false } } }
            });
        }

        // --- LISTE ADMIN ---
        function renderList(data) {
            if(data.length === 0) {
                document.getElementById('admin-list').innerHTML = '<div class="text-center py-20 font-prestige text-slate-400 italic">Aucun événement ne correspond à ces critères.</div>';
                return;
            }
            document.getElementById('admin-list').innerHTML = data.map(d => `
                <div id="fiche-${d.id}" class="card-premium overflow-hidden border-t-8 border-red-900 shadow-2xl transition-all">
                    <div class="p-6 bg-slate-100 flex justify-between items-center border-b-2">
                        <div class="flex items-center gap-4">
                            <span class="bg-red-900 text-white px-5 py-2 rounded-full font-black text-xs uppercase italic">${d.date_evenement}</span>
                            <h4 class="font-prestige text-2xl text-slate-800 tracking-tight italic">${d.nom_evenement}</h4>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="genererPDF('${d.id}')" class="bg-black text-white px-8 py-3 rounded-full text-[11px] font-black uppercase shadow-xl hover:bg-red-900 transition-all">PDF</button>
                            <button onclick="supprimerLigne('${d.id}')" class="bg-white text-red-600 border-2 border-red-100 p-3 rounded-full hover:bg-red-600 hover:text-white transition-all"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <div class="p-10 grid grid-cols-1 md:grid-cols-4 gap-12 text-[12px] leading-relaxed bg-white font-medium">
                        <div class="space-y-4">
                            <p class="font-black text-red-900 uppercase italic border-b pb-2">Identification</p>
                            <p>Client: <b class="text-slate-900 italic underline decoration-amber-500">${d.organisme}</b></p>
                            <p>Contact: <b class="text-slate-900">${d.point_contact}</b></p>
                            <p>Email: <b class="text-slate-900">${d.contact_email}</b></p>
                        </div>
                        <div class="space-y-4">
                            <p class="font-black text-orange-600 uppercase italic border-b pb-2">Logistique</p>
                            <p>Participants: <b class="text-red-900 text-lg">${d.nb_participants}</b></p>
                            <p>Horaires: <b class="text-slate-900">${d.heure_orga} - ${d.heure_fin}</b></p>
                            <p>Espaces: <b class="text-slate-700">${d.lieux_accueil?.join(', ') || 'Standard'}</b></p>
                        </div>
                        <div class="space-y-4">
                            <p class="font-black text-blue-600 uppercase italic border-b pb-2">Technique</p>
                            <p>Micros: <b class="text-blue-900">${d.micros_hf_regie} HF / ${d.micros_filaires_scene} Fil</b></p>
                            <p>Mobilier: <b class="text-slate-900">${d.nb_chaises} chaises, ${d.nb_tables} tables</b></p>
                            <p>Options: <b class="text-blue-600">${d.options_tech?.join(', ') || 'Aucune'}</b></p>
                        </div>
                        <div class="space-y-4 bg-amber-50 p-6 rounded-3xl border-2 border-amber-50 shadow-inner">
                            <p class="font-black text-amber-800 uppercase italic border-b border-amber-200 pb-2">Notes Cadets</p>
                            <p>Retrans: <b>${d.cadets_retransmission ? 'OUI' : 'NON'}</b></p>
                            <p class="italic text-slate-500">${d.cadets_notes || 'Aucun besoin spécifique'}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // FORM SUBMIT
        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                organisme: document.getElementById('organisme').value,
                nom_evenement: document.getElementById('nom_evenement').value,
                point_contact: document.getElementById('point_contact').value,
                contact_email: document.getElementById('contact_email').value,
                contact_tel: document.getElementById('contact_tel').value,
                date_evenement: document.getElementById('date_evenement').value,
                heure_orga: document.getElementById('heure_orga').value,
                heure_public: document.getElementById('heure_public').value,
                heure_fin: document.getElementById('heure_fin').value,
                nb_participants: parseInt(document.getElementById('nb_participants').value) || 0,
                wifi_public: document.getElementById('wifi_public').checked,
                lieux_accueil: Array.from(document.querySelectorAll('#acc_list input:checked')).map(i => i.value),
                lieux_vestiaire: Array.from(document.querySelectorAll('#vest_list input:checked')).map(i => i.value),
                nb_chaises: parseInt(document.getElementById('nb_chaises').value) || 0,
                nb_tables: parseInt(document.getElementById('nb_tables').value) || 0,
                micros_hf_regie: parseInt(document.getElementById('micros_hf').value) || 0,
                micros_filaires_scene: parseInt(document.getElementById('micros_filaires').value) || 0,
                options_tech: Array.from(document.querySelectorAll('#tech_opts input:checked')).map(i => i.value),
                cadets_retransmission: document.getElementById('cadets_retrans').checked,
                cadets_notes: document.getElementById('cadets_notes').value
            };
            const { error } = await _supa.from('demandes_auditorium').insert([payload]);
            if (!error) { alert("Fiche technique transmise avec succès !"); location.reload(); }
        };

        window.genererPDF = function(id) {
            const d = filteredData.find(item => item.id === id);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(127, 29, 29); doc.rect(0, 0, 210, 40, 'F');
            doc.setTextColor(255, 255, 255); doc.setFontSize(22); doc.text("FICHE TECHNIQUE AUDITORIUM", 20, 28);
            doc.autoTable({ startY: 50, head: [['Sujet', 'Info']], body: [['Événement', d.nom_evenement],['Date', d.date_evenement],['Client', d.organisme]], headStyles: { fillColor: [127, 29, 29] } });
            doc.save(`Fiche_${d.nom_evenement}.pdf`);
        };

        async function supprimerLigne(id) { if(confirm("Supprimer ?")) { await _supa.from('demandes_auditorium').delete().eq('id', id); chargerDonnees(); } }
        function handleLogout() { _supa.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
